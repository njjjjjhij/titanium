le>Titanium — source\u003c/title>\n  \u003clink rel=\"icon\" href=\"icon.svg\" type=\"image/svg+xml\">\n  \u003cstyle>/*STYLES*/\u003c/style>\n  \u003cstyle>\n    .src-head {\n      position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;\n      gap: 12px; padding: 13px clamp(14px, 3vw, 30px); flex-wrap: wrap;\n      background: color-mix(in srgb, var(--bg) 92%, transparent);\n      backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);\n    }\n    .src-tag { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }\n    .src-actions { display: flex; gap: 8px; flex-wrap: wrap; }\n    .src-actions .ghost-btn, .src-actions .mini-btn { padding: 8px 13px; font-size: 12.5px; }\n    .src-wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100dvh - 60px); }\n    .src-list { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; position: sticky; top: 60px; align-self: start; max-height: calc(100dvh - 60px); overflow: auto; }\n    .src-file { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: transparent; color: var(--text); text-align: left; padding: 9px 11px; border-radius: 10px; font-size: 13px; }\n    .src-file:hover { background: var(--card-2); }\n    .src-file[aria-current=\"true\"] { background: var(--card); box-shadow: inset 0 0 0 1px var(--line-strong); }\n    .src-file small { color: var(--muted-2); font-size: 10.5px; white-space: nowrap; }\n    .src-main { padding: 16px clamp(12px, 2.5vw, 26px) 44px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }\n    .src-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }\n    .src-bar b { font-size: 15px; }\n    .src-bar small { display: block; color: var(--muted-2); font-size: 11.5px; }\n    .src-btns { display: flex; gap: 6px; flex-wrap: wrap; }\n    .src-code, .src-editor {\n      margin: 0; padding: 18px; border-radius: 14px; background: #0e1014; border: 1px solid var(--line);\n      color: #d7e0ef; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n      font-size: 12.5px; line-height: 1.62; max-height: 74dvh;\n    }\n    .src-code { white-space: pre; }\n    .src-editor { width: 100%; min-height: 62dvh; resize: vertical; }\n    .src-note { color: var(--muted); font-size: 12.5px; max-width: 82ch; margin: 0; }\n    .src-note b { color: var(--text); }\n    @media (max-width: 780px) {\n      .src-wrap { grid-template-columns: 1fr; }\n      .src-list { position: static; flex-direction: row; overflow-x: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }\n      .src-file { white-space: nowrap; }\n      .src-file small { display: none; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"src-head\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\">Ti\u003c/span> Titanium \u003cspan class=\"src-tag\">source\u003c/span>\u003c/div>\n    \u003cdiv class=\"src-actions\">\n      \u003cbutton class=\"ghost-btn\" id=\"applyCss\">Apply CSS to my Titanium\u003c/button>\n      \u003cbutton class=\"ghost-btn\" id=\"resetCss\">Reset CSS override\u003c/button>\n      \u003ca class=\"ghost-btn\" href=\"index.html\">Open browser\u003c/a>\n      \u003ca class=\"ghost-btn\" href=\"README.md\">README\u003c/a>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"src-wrap\">\n    \u003cnav class=\"src-list\" id=\"srcList\" aria-label=\"Source files\">\u003c/nav>\n    \u003cmain class=\"src-main\">\n      \u003cdiv class=\"src-bar\">\n        \u003cdiv>\u003cb id=\"srcName\">…\u003c/b>\u003csmall id=\"srcMeta\">\u003c/small>\u003c/div>\n        \u003cdiv class=\"src-btns\">\n          \u003cbutton class=\"mini-btn\" id=\"srcEdit\">Edit\u003c/button>\n          \u003cbutton class=\"mini-btn\" id=\"srcCopy\">Copy\u003c/button>\n          \u003cbutton class=\"mini-btn accent\" id=\"srcDownload\">Download\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cpre class=\"src-code\" id=\"srcCode\">\u003c/pre>\n      \u003ctextarea class=\"src-editor\" id=\"srcEditor\" hidden spellcheck=\"false\" aria-label=\"Edit source\">\u003c/textarea>\n      \u003cp class=\"src-note\" id=\"srcNote\">\u003c/p>\n    \u003c/main>\n  \u003c/div>\n  \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cscript>window.SOURCE_FILES = /*SOURCES*/;\u003c/script>\n  \u003cscript>/*SOURCE_JS*/\u003c/script>\n\u003c/body>\n\u003c/html>\n","src/source.js":"'use strict';\n/* ============================================================\n   Titanium — source browser\n   Reads the embedded project sources, lets anyone edit them in\n   place, copy them, download them, and apply a CSS override to\n   the browser running on this device.\n   ============================================================ */\n\nconst FILES = window.SOURCE_FILES || {};\nconst ORDER = [\n  'src/app.js',\n  'src/icons.js',\n  'src/onboarding.js',\n  'src/panels.js',\n  'src/panels2.js',\n  'src/actions.js',\n  'src/extensions.js',\n  'src/boot.js',\n  'src/styles.css',\n  'src/template.html',\n  'src/source.js',\n  'src/source.template.html',\n  'build.mjs',\n  'README.md',\n  'icon.svg'\n];\n\nconst edits = {};\nlet current = ORDER.find((f) => f in FILES) || Object.keys(FILES)[0];\nlet editing = false;\n\nconst $ = (s) => document.querySelector(s);\n\nfunction textOf(name) {\n  return edits[name] !== undefined ? edits[name] : (FILES[name] || '');\n}\n\nfunction bytes(n) {\n  return n > 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B';\n}\n\nfunction renderList() {\n  const list = $('#srcList');\n  list.innerHTML = ORDER.filter((f) => f in FILES).map((f) => {\n    const lines = textOf(f).split('\\n').length;\n    return `\u003cbutton class=\"src-file\" data-file=\"${f}\" aria-current=\"${f === current}\">\n      \u003cspan>${f.replace(/^src\\//, '')}\u003c/span>\n      \u003csmall>${edits[f] !== undefined ? 'edited' : lines + ' lines'}\u003c/small>\n    \u003c/button>`;\n  }).join('');\n  list.querySelectorAll('[data-file]').forEach((btn) => {\n    btn.addEventListener('click', () => select(btn.dataset.file));\n  });\n}\n\nfunction select(name) {\n  current = name;\n  editing = false;\n  const text = textOf(name);\n  $('#srcName').textContent = name;\n  $('#srcMeta').textContent = `${text.split('\\n').length} lines · ${bytes(new Blob([text]).size)}${edits[name] !== undefined ? ' · edited in this tab' : ''}`;\n  $('#srcCode').textContent = text;\n  $('#srcCode').hidden = false;\n  const editor = $('#srcEditor');\n  editor.hidden = true;\n  editor.value = text;\n  $('#srcEdit').textContent = 'Edit';\n  $('#srcNote').innerHTML = name === 'README.md'\n    ? 'This is the page GitHub shows. It stays prose — the code lives in the files beside it.'\n    : name === 'src/styles.css'\n      ? 'Edit the stylesheet here and use \u003cb>Apply CSS to my Titanium\u003c/b> to see it live in the browser on this device, then download the file to keep it.'\n      : 'Edit in place, then copy or download. Nothing is uploaded anywhere — your copy stays yours.';\n  renderList();\n}\n\nfunction toggleEdit() {\n  const editor = $('#srcEditor');\n  editing = !editing;\n  if (editing) {\n    editor.hidden = false;\n    $('#srcCode').hidden = true;\n    $('#srcEdit').textContent = 'Preview';\n    editor.focus();\n  } else {\n    edits[current] = editor.value;\n    $('#srcCode').textContent = editor.value;\n    editor.hidden = true;\n    $('#srcCode').hidden = false;\n    $('#srcEdit').textContent = 'Edit';\n    select(current);\n    toast('Changes kept in this tab — download to keep them forever');\n  }\n}\n\nasync function copyCurrent() {\n  try {\n    await navigator.clipboard.writeText(textOf(current));\n    toast('Copied ' + current);\n  } catch {\n    toast('Copy was blocked — select the text and copy manually');\n  }\n}\n\nfunction downloadCurrent() {\n  const blob = new Blob([textOf(current)], { type: 'text/plain' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = current.split('/').pop();\n  a.click();\n  URL.revokeObjectURL(a.href);\n  toast('Downloaded ' + a.download);\n}\n\nfunction applyCss() {\n  if (current !== 'src/styles.css') {\n    toast('Open styles.css first, then apply');\n    return;\n  }\n  try {\n    localStorage.setItem('ti.css.override', textOf('src/styles.css'));\n    toast('CSS applied to Titanium on this device — reload the browser');\n  } catch {\n    toast('Could not save the override');\n  }\n}\n\nfunction resetCss() {\n  try {\n    localStorage.removeItem('ti.css.override');\n    toast('CSS override removed');\n  } catch {\n    toast('Nothing to reset');\n  }\n}\n\nlet toastTimer = null;\nfunction toast(msg) {\n  const t = $('#toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);\n}\n\n$('#srcEdit').addEventListener('click', toggleEdit);\n$('#srcCopy').addEventListener('click', copyCurrent);\n$('#srcDownload').addEventListener('click', downloadCurrent);\n$('#applyCss').addEventListener('click', applyCss);\n$('#resetCss').addEventListener('click', resetCss);\ndocument.addEventListener('keydown', (e) => {\n  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {\n    e.preventDefault();\n    if (editing) toggleEdit();\n    else downloadCurrent();\n  }\n});\n\nselect(current);\n","build.mjs":"// Titanium build — produces index.html (single-file browser) and\n// source.html (standalone source browser with every file embedded).\n// Usage: node build.mjs\nimport { readFileSync, writeFileSync } from 'node:fs';\nimport { dirname, join } from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst root = dirname(fileURLToPath(import.meta.url));\nconst read = (p) => readFileSync(join(root, p), 'utf8');\nconst write = (p, data) => writeFileSync(join(root, p), data);\n\nconst scripts = [\n  'src/icons.js',\n  'src/app.js',\n  'src/onboarding.js',\n  'src/panels.js',\n  'src/panels2.js',\n  'src/actions.js',\n  'src/extensions.js',\n  'src/boot.js'\n];\n\nconst styles = read('src/styles.css');\nconst js = scripts.map(read).join('\\n\\n');\n\n/* ---------- the browser ---------- */\nconst html = read('src/template.html')\n  .replace('/*STYLES*/', () => styles)\n  .replace('/*SCRIPT*/', () => js);\nwrite('index.html', html);\n\n/* ---------- the source browser ---------- */\nconst sourceFiles = {};\nfor (const file of ['src/template.html', ...scripts, 'src/styles.css', 'src/source.template.html', 'src/source.js', 'build.mjs', 'README.md', 'icon.svg']) {\n  sourceFiles[file] = read(file);\n}\n\nconst bundle = JSON.stringify(sourceFiles).replace(/\u003c/g, '\\\\u003c');\n// Replace the script slot before injecting the bundle: the bundle contains\n// this same marker as text, so order matters.\nconst sourceHtml = read('src/source.template.html')\n  .replace('/*STYLES*/', () => styles)\n  .replace('/*SOURCE_JS*/', () => read('src/source.js'))\n  .replace('/*SOURCES*/', () => bundle);\nwrite('source.html', sourceHtml);\n\nconsole.log(`index.html  ${(html.length / 1024).toFixed(1)} KB (${scripts.length} modules)`);\nconsole.log(`source.html ${(sourceHtml.length / 1024).toFixed(1)} KB (${Object.keys(sourceFiles).length} files embedded)`);\n","README.md":"\u003cp align=\"center\">\n  \u003cimg src=\"icon.svg\" alt=\"Titanium icon\" width=\"112\" height=\"112\">\n\u003c/p>\n\n\u003ch1 align=\"center\">Titanium\u003c/h1>\n\u003cp align=\"center\">\u003cb>Metal for the web.\u003c/b>\u003cbr>A private, deeply customizable browser that ships as one HTML file.\u003c/p>\n\n\u003cp align=\"center\">\n  \u003cimg alt=\"single file\" src=\"https://img.shields.io/badge/build-single%20html%20file-8ab4f8?style=flat-square\">\n  \u003cimg alt=\"licence\" src=\"https://img.shields.io/badge/licence-MIT-74d6a3?style=flat-square\">\n  \u003cimg alt=\"dependencies\" src=\"https://img.shields.io/badge/dependencies-none-8ab4f8?style=flat-square\">\n  \u003cimg alt=\"plans\" src=\"https://img.shields.io/badge/plans-Free%20%7C%20Premium%20%7C%20Ultimate-b9a6ff?style=flat-square\">\n\u003c/p>\n\n---\n\nTitanium is a browser surface: a start page, real tabs, fifteen search engines with their real logos, ad blocking controls, a VPN surface, Chrome extension loading, history with scoped delegation, and three plans — all inside one HTML file with no framework, no network calls and no server.\n\nOpen the file, answer five questions, and you land on a start screen shaped for the device you picked: full-bleed cards on mobile, a wider canvas on desktop.\n\n## Screenshots\n\n| Onboarding | Start page |\n|---|---|\n| ![Onboarding](screenshot-onboarding.png) | ![Start page](screenshot-home.png) |\n\n| Extensions | A real extension popup, running |\n|---|---|\n| ![Extensions](screenshot-extensions.png) | ![Popup](screenshot-popup.png) |\n\n## Two files, one project\n\n**index.html** is the browser. That is the whole product — open it and browse. Nothing to install, nothing to compile, no package manager, no account.\n\n**source.html** is a working source browser. It carries every source file inside it, shows them in tabs, lets you edit them in place, copy them, download them, and — for the stylesheet — apply your changes live to the Titanium running on your device. It is how you make the browser yours without setting up a toolchain.\n\nThe human-readable sources also sit in **src/**. The build is a single command, described under Make it yours.\n\n## The five questions\n\n| # | Question | What it configures |\n|---|----------|--------------------|\n| 1 | Where did you hear about us? | Stored locally. Never transmitted. |\n| 2 | Mobile or PC? | Lays out the entire app immediately: card sizing, columns, tab strip, touch targets. |\n| 3 | Who's browsing? | A local profile: display name, email and avatar colour. Guest and \"later\" are one tap. |\n| 4 | Should Titanium remember where you've been? | History on or off, private-by-default tabs, retention window. |\n| 5 | Who gets to see your history? | History delegation: keep it device-only, grant a scoped expiring code, or import someone else's. |\n\nEvery answer can be changed later, and **Skip setup** drops you on sensible defaults.\n\n## Search, with real icons\n\nA strip of the actual service logos sits under the search bar. Tap any icon and that engine becomes the one Titanium searches with — no menus, no dropdowns.\n\nThe fifteen engines are DuckDuckGo, Google, Brave Search, Ecosia, Bing, Yahoo, Startpage, Qwant, Mojeek, Swisscows, Presearch, SearXNG, Yandex, Baidu and Kagi. Icons are the real 64-pixel service marks, embedded as data URIs so the browser still works offline and makes no requests to fetch them. Ultimate adds a custom engine with any query template.\n\nThe same real marks follow your shortcuts, history rows and tab strip, so a page is recognisable at a glance. If you prefer a quieter look, switch icons to monochrome in Appearance.\n\n## What else is inside\n\n**Start page.** Search pill with engine mark, an Add new shortcut tile, a Safety Check card with live shield state, quick links, a compact status line for VPN, ad blocking and history, and jump-back-in recents. Each card can be turned off.\n\n**Tabs.** Real tabs with per-tab back stacks, an icon-only strip on mobile, tab counts, and limits by plan.\n\n**Ad and tracker blocking.** Four levels — Off, Balanced on Free, Strict on Premium, Aggressive on Ultimate — plus custom network and cosmetic filter rules on Premium and above. Safe Browsing, Do Not Track, HTTPS-only and third-party cookie controls sit beside them.\n\n**VPN.** Sixteen locations, WireGuard, OpenVPN and IKEv2, a kill switch on Premium and split tunnelling on Ultimate, with a clear connected state.\n\n**Chrome extensions.** Install a CRX or ZIP, or load an unpacked folder. Titanium reads the manifest, renders extension popups in a sandbox and answers chrome.storage, chrome.runtime, chrome.tabs and chrome.i18n through a compatibility shim. Storage is per extension, and removing one deletes its files and data.\n\n**History and delegation.** Retention of 7, 90 or 365 days by plan, private tabs excluded, searchable list, one-tap clear and JSON export. Delegation turns a scoped snapshot into a code you can hand to another device; the codes are generated locally and every grant, import and revocation is written to an access log.\n\n**Look and feel.** Five themes, seven accents plus any custom colour, five one-tap presets, corner radius and text size sliders, three densities, search bar shapes, colour or monochrome icons, and toggles for every start-page element. All of it is free.\n\n## Plans\n\nFree is the floor and stays useful forever. Each tier is strictly better than the one below it.\n\n| | Free | Premium — $4.99/mo | Ultimate — $9.99/mo |\n|---|---|---|---|\n| Ad blocking | Balanced | Strict + custom filters | Aggressive + miner protection |\n| VPN | 3 locations | 12 + kill switch | All 16 + split tunnelling |\n| Extensions | 2 | 10 | Unlimited |\n| History | 7 days | 90 days | 1 year |\n| Delegation | — | 1 delegate | Up to 5 delegates |\n| Tabs | 5 | 20 | Unlimited |\n| Search | All 15 engines | All 15 engines | + custom engine |\n| Appearance | Everything | Everything | Everything |\n\nPlan switching in this build is a demo checkout: no card, no charge, and the entitlement flips locally so every gated feature can be tried.\n\n## Make it yours\n\nTitanium is deliberately easy to fork for yourself, in three ways.\n\nThe fastest is inside the app: open the menu, choose Source code, and you get the working source browser. Pick a file, hit Edit, change it, then download it or copy it. For the stylesheet there is an Apply CSS button that writes your edited CSS into this device's storage, so the browser restyles itself on the next reload. Reset CSS override undoes it.\n\nThe second is on disk. The sources live in the **src** folder as ordinary scripts and one stylesheet, with **build.mjs** stitching them into **index.html**. With Node installed, run the build with the command name that matches the file — the script is dependency-free, so nothing needs installing first. Edit anything, rebuild, reload.\n\nThe third is to fork the repository and publish your version with GitHub Pages. Point Pages at the repository root; **index.html** and **source.html** both work as plain static files.\n\nNothing phones home. There is no account server, no analytics and no telemetry, so a fork is fully independent.\n\n## Icons and trademarks\n\nThe search engine, site and app marks are the real 64-pixel icons published by each service, embedded as data URIs. They are used only to identify the service you are choosing or the page you visited. All trademarks belong to their owners; Titanium claims no affiliation. The Titanium mark itself is the SVG in **icon.svg**, rasterised to **icon-512.png**.\n\n## Honest limits\n\n| Limit | Why | Path forward |\n|---|---|---|\n| Sites that forbid embedding cannot load in a tab | Only a top-level browser can ignore X-Frame-Options and frame-ancestors | A native shell, or open the page in your installed browser — Titanium offers exactly that button |\n| The VPN is a simulated tunnel | A single HTML file has no network stack to encrypt | A native shell or a WireGuard helper process |\n| Extension service workers and cross-origin content scripts do not run | They need Chrome's process model | Package Titanium as a real browser or extension host |\n| Voice search needs the Web Speech API | Browser support varies | It already degrades to a clear message |\n\nWhen a page refuses to load, Titanium says so plainly and offers to open it outside. It never pretends a page rendered.\n\n## Privacy\n\nNo analytics, no telemetry, no accounts server, no cookies set by Titanium. Your profile, plan, history, shortcuts, extensions and delegation codes stay on the device. Reset Titanium wipes all of it, and deleting the local profile from the Account panel does the same.\n\n## Contributing\n\nIssues and pull requests are welcome. Keep it dependency-free, keep **index.html** and **source.html** as the shipped artefacts, keep the rebuild to one command, and keep the honest-limits section honest. Regenerate both HTML files before opening a pull request.\n\n## Roadmap\n\n- Optional native shell for a real VPN and unfiltered tabs\n- Download manager and reader mode\n- A content-script sandbox for same-origin tabs\n- Tab groups and pinned tabs\n- Encrypted delegation codes\n\n## Licence\n\nMIT. See **LICENSE**. Fork it, ship it, rename it.\n","icon.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\" width=\"512\" height=\"512\" role=\"img\" aria-label=\"Titanium browser icon\">\n  \u003cdefs>\n    \u003clinearGradient id=\"plate\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      \u003cstop offset=\"0\" stop-color=\"#2b3240\"/>\n      \u003cstop offset=\"0.55\" stop-color=\"#1b1f27\"/>\n      \u003cstop offset=\"1\" stop-color=\"#12151b\"/>\n    \u003c/linearGradient>\n    \u003clinearGradient id=\"metal\" gradientUnits=\"userSpaceOnUse\" x1=\"188\" y1=\"160\" x2=\"324\" y2=\"350\">\n      \u003cstop offset=\"0\" stop-color=\"#eef3ff\"/>\n      \u003cstop offset=\"0.42\" stop-color=\"#9fb6d6\"/>\n      \u003cstop offset=\"0.72\" stop-color=\"#7c93b3\"/>\n      \u003cstop offset=\"1\" stop-color=\"#c9d8ee\"/>\n    \u003c/linearGradient>\n    \u003clinearGradient id=\"beam\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n      \u003cstop offset=\"0\" stop-color=\"#8ab4f8\"/>\n      \u003cstop offset=\"1\" stop-color=\"#4a8cf7\"/>\n    \u003c/linearGradient>\n    \u003cpath id=\"shield\" d=\"M256 96 L368 140 C368 274 322 358 256 404 C190 358 144 274 144 140 Z\"/>\n  \u003c/defs>\n\n  \u003crect x=\"0\" y=\"0\" width=\"512\" height=\"512\" rx=\"112\" fill=\"url(#plate)\"/>\n  \u003crect x=\"14\" y=\"14\" width=\"484\" height=\"484\" rx=\"100\" fill=\"none\" stroke=\"#ffffff\" stroke-opacity=\"0.06\" stroke-width=\"3\"/>\n\n  \u003cg opacity=\"0.95\">\n    \u003cuse href=\"#shield\" fill=\"none\" stroke=\"url(#beam)\" stroke-width=\"18\" stroke-linejoin=\"round\"/>\n  \u003c/g>\n\n  \u003cpath d=\"M188 178 H324\" stroke=\"url(#metal)\" stroke-width=\"34\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M256 178 V338\" stroke=\"url(#metal)\" stroke-width=\"34\" stroke-linecap=\"round\"/>\n\n  \u003ccircle cx=\"360\" cy=\"150\" r=\"16\" fill=\"url(#beam)\"/>\n\u003c/svg>\n"};</script>
  <script>'use strict';
/* ============================================================
   Titanium — source browser
   Reads the embedded project sources, lets anyone edit them in
   place, copy them, download them, and apply a CSS override to
   the browser running on this device.
   ============================================================ */

const FILES = window.SOURCE_FILES || {};
const ORDER = [
  'src/app.js',
  'src/icons.js',
  'src/onboarding.js',
  'src/panels.js',
  'src/panels2.js',
  'src/actions.js',
  'src/extensions.js',
  'src/boot.js',
  'src/styles.css',
  'src/template.html',
  'src/source.js',
  'src/source.template.html',
  'build.mjs',
  'README.md',
  'icon.svg'
];

const edits = {};
let current = ORDER.find((f) => f in FILES) || Object.keys(FILES)[0];
let editing = false;

const $ = (s) => document.querySelector(s);

function textOf(name) {
  return edits[name] !== undefined ? edits[name] : (FILES[name] || '');
}

function bytes(n) {
  return n > 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B';
}

function renderList() {
  const list = $('#srcList');
  list.innerHTML = ORDER.filter((f) => f in FILES).map((f) => {
    const lines = textOf(f).split('\n').length;
    return `<button class="src-file" data-file="${f}" aria-current="${f === current}">
      <span>${f.replace(/^src\//, '')}</span>
      <small>${edits[f] !== undefined ? 'edited' : lines + ' lines'}</small>
    </button>`;
  }).join('');
  list.querySelectorAll('[data-file]').forEach((btn) => {
    btn.addEventListener('click', () => select(btn.dataset.file));
  });
}

function select(name) {
  current = name;
  editing = false;
  const text = textOf(name);
  $('#srcName').textContent = name;
  $('#srcMeta').textContent = `${text.split('\n').length} lines · ${bytes(new Blob([text]).size)}${edits[name] !== undefined ? ' · edited in this tab' : ''}`;
  $('#srcCode').textContent = text;
  $('#srcCode').hidden = false;
  const editor = $('#srcEditor');
  editor.hidden = true;
  editor.value = text;
  $('#srcEdit').textContent = 'Edit';
  $('#srcNote').innerHTML = name === 'README.md'
    ? 'This is the page GitHub shows. It stays prose — the code lives in the files beside it.'
    : name === 'src/styles.css'
      ? 'Edit the stylesheet here and use <b>Apply CSS to my Titanium</b> to see it live in the browser on this device, then download the file to keep it.'
      : 'Edit in place, then copy or download. Nothing is uploaded anywhere — your copy stays yours.';
  renderList();
}

function toggleEdit() {
  const editor = $('#srcEditor');
  editing = !editing;
  if (editing) {
    editor.hidden = false;
    $('#srcCode').hidden = true;
    $('#srcEdit').textContent = 'Preview';
    editor.focus();
  } else {
    edits[current] = editor.value;
    $('#srcCode').textContent = editor.value;
    editor.hidden = true;
    $('#srcCode').hidden = false;
    $('#srcEdit').textContent = 'Edit';
    select(current);
    toast('Changes kept in this tab — download to keep them forever');
  }
}

async function copyCurrent() {
  try {
    await navigator.clipboard.writeText(textOf(current));
    toast('Copied ' + current);
  } catch {
    toast('Copy was blocked — select the text and copy manually');
  }
}

function downloadCurrent() {
  const blob = new Blob([textOf(current)], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = current.split('/').pop();
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Downloaded ' + a.download);
}

function applyCss() {
  if (current !== 'src/styles.css') {
    toast('Open styles.css first, then apply');
    return;
  }
  try {
    localStorage.setItem('ti.css.override', textOf('src/styles.css'));
    toast('CSS applied to Titanium on this device — reload the browser');
  } catch {
    toast('Could not save the override');
  }
}

function resetCss() {
  try {
    localStorage.removeItem('ti.css.override');
    toast('CSS override removed');
  } catch {
    toast('Nothing to reset');
  }
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

$('#srcEdit').addEventListener('click', toggleEdit);
$('#srcCopy').addEventListener('click', copyCurrent);
$('#srcDownload').addEventListener('click', downloadCurrent);
$('#applyCss').addEventListener('click', applyCss);
$('#resetCss').addEventListener('click', resetCss);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (editing) toggleEdit();
    else downloadCurrent();
  }
});

select(current);
</script>
</body>
</html>
