3c/small>\u003c/span>\n        \u003cdiv class=\"chips\" style=\"padding:0\">\n          ${[['color', 'Colour'], ['mono', 'Mono']].map(([id, label]) => `\u003cbutton class=\"chip\" data-act=\"iconStyle\" data-icons=\"${id}\" aria-pressed=\"${S.theme.iconStyle === id}\">${label}\u003c/button>`).join('')}\n        \u003c/div>\n      \u003c/div>\n      ${toggleRow({ title: 'Ambient wallpaper glow', sub: 'Tint the canvas with your accent colour', path: 'theme.wallpaper', checked: S.theme.wallpaper })}\n      ${toggleRow({ title: 'Show tab names', sub: 'Off keeps the top strip icon-only, like a phone', path: 'theme.tabLabels', checked: S.theme.tabStyle === 'tiles' })}\n    \u003c/div>\n\n    \u003cdiv class=\"section-label\">Start page\u003c/div>\n    \u003cdiv class=\"list\">\n      ${toggleRow({ title: 'Shortcuts', sub: 'Your pinned sites under the search bar', path: 'home.shortcuts', checked: S.home.shortcuts })}\n      ${toggleRow({ title: 'Safety Check card', sub: 'The protection card from the start screen', path: 'home.safety', checked: S.home.safety })}\n      ${toggleRow({ title: 'Quick links grid', sub: 'Always-visible site tiles', path: 'home.quicklinks', checked: S.home.quicklinks })}\n      ${toggleRow({ title: 'Jump back in', sub: 'Recent history on the start page', path: 'home.recent', checked: S.home.recent })}\n      ${toggleRow({ title: 'Search suggestions', sub: 'History matches while you type', path: 'home.suggestions', checked: S.home.suggestions })}\n      ${toggleRow({ title: 'Engine strip', sub: 'A row of real engine icons under the search bar', path: 'home.engines', checked: S.home.engines !== false })}\n      ${toggleRow({ title: 'Greeting', sub: 'Time-of-day line above the search bar', path: 'home.greeting', checked: S.home.greeting !== false })}\n      ${toggleRow({ title: 'Status card', sub: 'VPN, ad blocking and history state', path: 'home.status', checked: S.home.status !== false })}\n      ${toggleRow({ title: 'Animations', sub: 'Sheet, hover and press motion', path: 'theme.animations', checked: S.theme.animations !== false })}\n    \u003c/div>\n    \u003cbutton class=\"ghost-btn\" data-act=\"resetLook\">Reset look to defaults\u003c/button>`\n});\n\n/* ---------------- engines ---------------- */\nPANELS.engines = () => ({\n  title: 'Search engine',\n  html: `\n    \u003cp class=\"step-sub\">Titanium asks whichever engine you choose. Your pick is never sent anywhere but the engine itself.\u003c/p>\n    \u003cdiv class=\"list\">\n      ${ENGINES.map((e) => `\u003cbutton class=\"list-row\" data-act=\"engine\" data-engine=\"${e.id}\">\n        \u003cspan class=\"engine-logo\" style=\"background:transparent\">${brandMark(e.brand, 22)}\u003c/span>\n        \u003cspan class=\"lr-body\">\u003cb>${e.name}\u003c/b>\u003csmall>${e.note}\u003c/small>\u003c/span>\n        ${S.engine === e.id && !S.customEngine.name ? '\u003cspan class=\"perm\" style=\"color:var(--accent)\">Active\u003c/span>' : '\u003cspan class=\"chev\">›\u003c/span>'}\n      \u003c/button>`).join('')}\n    \u003c/div>\n    \u003cdiv class=\"section-label\">Custom engine ${planLock('ultimate')}\u003c/div>\n    \u003cdiv class=\"list\">\n      \u003cdiv class=\"field\">\u003clabel>Name\u003c/label>\u003cinput type=\"text\" data-input=\"customEngine.name\" value=\"${esc(S.customEngine.name)}\" placeholder=\"My search\" ${can('ultimate') ? '' : 'disabled'}>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Query URL (use %s)\u003c/label>\u003cinput type=\"text\" data-input=\"customEngine.url\" value=\"${esc(S.customEngine.url)}\" placeholder=\"https://example.com/search?q=%s\" ${can('ultimate') ? '' : 'disabled'}>\u003c/div>\n      \u003cdiv class=\"chips\">\u003cbutton class=\"mini-btn accent\" data-act=\"useCustom\" ${can('ultimate') ? '' : 'disabled'}>Use custom engine\u003c/button>\n      ${S.customEngine.name ? '\u003cbutton class=\"mini-btn danger\" data-act=\"clearCustom\">Remove\u003c/button>' : ''}\u003c/div>\n    \u003c/div>`\n});\n\n/* ---------------- privacy ---------------- */\nPANELS.privacy = () => ({\n  title: 'Privacy',\n  html: `\n    \u003cdiv class=\"section-label\">Ad & tracker blocking\u003c/div>\n    \u003cdiv class=\"chips\">\n      ${[['off', 'Off', 'free'], ['balanced', 'Balanced', 'free'], ['strict', 'Strict', 'premium'], ['aggressive', 'Aggressive', 'ultimate']].map(([id, label, need]) => `\n        \u003cbutton class=\"chip ${can(need) ? '' : 'lock'}\" data-act=\"adblock\" data-level=\"${id}\" aria-pressed=\"${S.privacy.adblock === id}\">${label}\u003c/button>`).join('')}\n    \u003c/div>\n    \u003cdiv class=\"banner\">${ico('shield')}\u003cdiv>\u003cb>${S.privacy.adblock === 'off' ? 'Blocking is off' : 'Blocking is active'}\u003c/b>\u003cspan>${S.privacy.adblock === 'balanced' ? 'Ads, trackers and annoying overlays are hidden on supported pages.' : S.privacy.adblock === 'strict' ? 'Adds fingerprinting scripts and social widgets to the block list.' : S.privacy.adblock === 'aggressive' ? 'Blocks aggressive interstitials, telemetry and known crypto-miners.' : 'Nothing is filtered while blocking is off.'} Frames from other origins are filtered by the browser engine, not by this page.\u003c/span>\u003c/div>\u003c/div>\n\n    \u003cdiv class=\"list\">\n      ${toggleRow({ title: 'Safe Browsing', sub: 'Warn before dangerous sites and downloads', path: 'privacy.safeBrowsing', checked: S.privacy.safeBrowsing })}\n      ${toggleRow({ title: 'Do Not Track', sub: 'Ask sites not to track you across visits', path: 'privacy.dnt', checked: S.privacy.dnt })}\n      ${toggleRow({ title: 'HTTPS-only', sub: 'Upgrade typed addresses to https', path: 'privacy.httpsOnly', checked: S.privacy.httpsOnly })}\n      ${toggleRow({ title: 'Block third-party cookies', sub: 'Sites can only read their own cookies', path: 'privacy.cookies', checked: S.privacy.cookies })}\n    \u003c/div>\n\n    \u003cdiv class=\"section-label\">Custom filters ${planLock('premium')}\u003c/div>\n    \u003cdiv class=\"list\">\n      \u003cdiv class=\"field\">\n        \u003clabel>One rule per line\u003c/label>\n        \u003ctextarea data-input=\"privacy.filters\" ${can('premium') ? '' : 'disabled'} placeholder=\"||ads.example.com^&#10;example.com##.sponsored\">${esc(S.privacy.filters)}\u003c/textarea>\n        \u003cspan class=\"hint\">Cosmetic rules use \u003ccode>domain##selector\u003c/code>; network rules use \u003ccode>||host^\u003c/code>.\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"chips\">\u003cspan class=\"perm\">${(S.privacy.filters || '').split('\\n').filter(Boolean).length} custom rules\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cbutton class=\"ghost-btn\" data-act=\"clearData\">Clear history and cookies\u003c/button>`\n});\n","src/panels2.js":"'use strict';\n/* ============================================================\n   Titanium — panels part 2: VPN, history, delegation, account,\n   plans, extensions, about, shortcuts\n   ============================================================ */\n\n/* ---------------- VPN ---------------- */\nPANELS.vpn = () => {\n  const visible = SERVERS.filter((s) => can(s.need) || s.id === 'auto');\n  return {\n    title: 'VPN',\n    html: `\n      \u003cdiv class=\"plan ${S.vpn.on ? 'current' : ''}\">\n        \u003cdiv class=\"plan-top\">\n          \u003cdiv>\n            \u003ch3>${S.vpn.on ? 'Connected' : 'Not connected'}\u003c/h3>\n            \u003csmall style=\"color:var(--muted)\">${S.vpn.on ? serverName(S.vpn.server) + ' · ' + S.vpn.protocol : 'Your IP is exposed to every site you open'}\u003c/small>\n          \u003c/div>\n          \u003cspan class=\"dot ${S.vpn.on ? 'on' : ''}\" style=\"width:12px;height:12px\">\u003c/span>\n        \u003c/div>\n        \u003cbutton class=\"accent-btn\" style=\"align-self:stretch\" data-act=\"vpnToggle\">${S.vpn.on ? 'Disconnect' : 'Connect VPN'}\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"banner\">${ico('info')}\u003cdiv>\u003cb>Simulated in this build\u003c/b>\u003cspan>This single-file demo shows the full VPN surface — locations, protocols, kill switch — but it cannot create a real encrypted tunnel. A shipping Titanium would route through a WireGuard endpoint; see the README.\u003c/span>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"section-label\">Location · ${SERVERS.filter((s) => can(s.need)).length} available\u003c/div>\n      \u003cdiv class=\"list\">\n        ${SERVERS.map((s) => {\n          const locked = !can(s.need);\n          return `\u003cbutton class=\"list-row\" data-act=\"${locked ? 'paywall' : 'server'}\" data-server=\"${s.id}\" data-need=\"${locked ? s.need : ''}\">\n            \u003cspan class=\"lr-icon\" style=\"font-size:17px\">${s.flag}\u003c/span>\n            \u003cspan class=\"lr-body\">\u003cb>${s.name}\u003c/b>\u003csmall>${locked ? 'Locked on ' + PLANS[S.plan].name : s.id === 'auto' ? 'Picks the closest healthy node' : 'WireGuard · 1 Gbps'}\u003c/small>\u003c/span>\n            ${locked ? '\u003cspan class=\"perm\">' + (s.need === 'premium' ? 'Premium' : 'Ultimate') + '\u003c/span>' : S.vpn.server === s.id ? '\u003cspan class=\"perm\" style=\"color:var(--accent)\">Selected\u003c/span>' : '\u003cspan class=\"chev\">›\u003c/span>'}\n          \u003c/button>`;\n        }).join('')}\n      \u003c/div>\n\n      \u003cdiv class=\"section-label\">Tunnel\u003c/div>\n      \u003cdiv class=\"list\">\n        \u003cdiv class=\"field\">\u003clabel>Protocol\u003c/label>\n          \u003cselect data-input=\"vpn.protocol\">\n            \u003coption value=\"wireguard\" ${S.vpn.protocol === 'wireguard' ? 'selected' : ''}>WireGuard (fastest)\u003c/option>\n            \u003coption value=\"openvpn\" ${S.vpn.protocol === 'openvpn' ? 'selected' : ''}>OpenVPN (most compatible)\u003c/option>\n            \u003coption value=\"ikev2\" ${S.vpn.protocol === 'ikev2' ? 'selected' : ''}>IKEv2 (mobile)\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        ${toggleRow({ title: 'Kill switch', sub: 'Drop traffic if the tunnel falls over', path: 'vpn.killSwitch', checked: S.vpn.killSwitch, need: 'premium' })}\n        ${toggleRow({ title: 'Split tunneling', sub: 'Choose which apps skip the VPN', path: 'vpn.split', checked: S.vpn.split, need: 'ultimate' })}\n      \u003c/div>`\n  };\n};\n\n/* ---------------- history ---------------- */\nPANELS.history = () => {\n  const items = S.history.items;\n  return {\n    title: 'History',\n    html: `\n      \u003cdiv class=\"list\">\n        ${toggleRow({ title: 'Save history', sub: 'Needed for suggestions and delegation', path: 'history.on', checked: S.history.on })}\n        ${toggleRow({ title: 'Private by default', sub: 'New tabs never record or delegate', path: 'history.incognito', checked: S.history.incognito })}\n      \u003c/div>\n\n      \u003cdiv class=\"section-label\">Keep history for\u003c/div>\n      \u003cdiv class=\"chips\">\n        ${[7, 90, 365].map((d) => {\n          const need = d > 90 ? 'ultimate' : d > 7 ? 'premium' : 'free';\n          return `\u003cbutton class=\"chip ${can(need) ? '' : 'lock'}\" data-act=\"retention\" data-days=\"${d}\" data-need=\"${need}\" aria-pressed=\"${S.history.retention === d}\">${d === 365 ? '1 year' : d + ' days'}\u003c/button>`;\n        }).join('')}\n      \u003c/div>\n\n      \u003cdiv class=\"section-label\">Entries · ${items.length}\u003c/div>\n      \u003cdiv class=\"field\" style=\"padding:0\">\n        \u003cinput id=\"histSearch\" type=\"text\" placeholder=\"Filter history\" autocomplete=\"off\">\n      \u003c/div>\n      \u003cdiv class=\"list\" id=\"histList\">\n        ${items.length ? items.slice(0, 200).map((h) => `\u003cdiv class=\"list-row\" data-hist-row data-text=\"${esc((h.title + ' ' + h.url).toLowerCase())}\">\n          \u003cspan class=\"lr-icon\" style=\"background:transparent\">${brandMarkForUrl(h.url, 22, h.title)}\u003c/span>\n          \u003cspan class=\"lr-body\">\u003cb>${esc(h.title)}\u003c/b>\u003csmall>${esc(h.url)} · ${timeAgo(h.ts)}\u003c/small>\u003c/span>\n          \u003cbutton class=\"mini-btn\" data-act=\"openHist\" data-url=\"${esc(h.url)}\">Open\u003c/button>\n          \u003cbutton class=\"mini-btn danger\" data-act=\"deleteHist\" data-id=\"${h.id}\" aria-label=\"Delete\">✕\u003c/button>\n        \u003c/div>`).join('') : `\u003cdiv class=\"empty\">\u003cb>No history yet\u003c/b>Pages you visit will show up here.\u003c/div>`}\n      \u003c/div>\n\n      \u003cdiv class=\"plan-actions\">\n        \u003cbutton class=\"mini-btn\" data-act=\"clearHistory\">Clear history\u003c/button>\n        \u003cbutton class=\"mini-btn\" data-act=\"sheet\" data-panel=\"delegation\">Delegate history\u003c/button>\n      \u003c/div>`,\n    bind: (root) => {\n      const search = $('#histSearch', root);\n      if (!search) return;\n      search.addEventListener('input', () => {\n        const q = search.value.trim().toLowerCase();\n        $$('[data-hist-row]', root).forEach((row) => {\n          row.hidden = q.length > 0 && !row.dataset.text.includes(q);\n        });\n      });\n    }\n  };\n};\n\n/* ---------------- delegation ---------------- */\nfunction b64uEncode(str) {\n  const bytes = new TextEncoder().encode(str);\n  let bin = '';\n  for (const b of bytes) bin += String.fromCharCode(b);\n  return btoa(bin).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');\n}\nfunction b64uDecode(str) {\n  const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));\n  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));\n  return new TextDecoder().decode(bytes);\n}\n\nfunction buildDelegationCode() {\n  const d = S.delegation.active;\n  if (!d) return '';\n  const items = S.history.items.slice(0, 200).map((h) => ({\n    title: h.title,\n    url: d.scope.urls ? h.url : '',\n    ts: h.ts\n  }));\n  const payload = {\n    v: 1,\n    app: 'titanium',\n    from: S.account?.name || 'Titanium',\n    created: d.createdAt,\n    expires: d.expiresAt,\n    scope: d.scope,\n    items\n  };\n  return 'TiD1.' + b64uEncode(JSON.stringify(payload));\n}\n\nfunction importDelegation(code) {\n  try {\n    const clean = String(code || '').trim();\n    if (!clean.startsWith('TiD1.')) return { ok: false, error: 'That is not a Titanium delegation code' };\n    const payload = JSON.parse(b64uDecode(clean.slice(5)));\n    if (payload.v !== 1 || payload.app !== 'titanium') return { ok: false, error: 'Unsupported delegation code version' };\n    if (payload.expires && payload.expires \u003c Date.now()) return { ok: false, error: 'This delegation code has expired' };\n    const incoming = (payload.items || []).map((h) => ({\n      id: uid(),\n      url: h.url || 'delegated://' + encodeURIComponent(h.title || 'entry'),\n      title: h.title || 'Delegated entry',\n      ts: Number(h.ts) || Date.now(),\n      delegated: payload.from || true\n    }));\n    const known = new Set(S.history.items.map((h) => h.url + h.ts));\n    const fresh = incoming.filter((h) => !known.has(h.url + h.ts));\n    S.history.items = [...fresh, ...S.history.items].sort((a, b) => b.ts - a.ts).slice(0, 600);\n    S.delegation.log.unshift({ ts: Date.now(), text: `Imported ${fresh.length} entries from ${payload.from || 'a delegate'}` });\n    pruneHistory();\n    save();\n    renderHome();\n    return { ok: true, count: fresh.length };\n  } catch {\n    return { ok: false, error: 'Could not read that code — it may be truncated' };\n  }\n}\n\nPANELS.delegation = () => {\n  const d = S.delegation.active;\n  const expired = d && d.expiresAt \u003c Date.now();\n  const code = d ? ($('#delegCode')?.textContent || d.code || '') : '';\n  return {\n    title: 'History delegation',\n    html: `\n      \u003cp class=\"step-sub\">Hand a scoped, expiring copy of your history to a person or another device. Codes are generated locally — no Titanium server ever sees them.\u003c/p>\n\n      ${d ? `\n        \u003cdiv class=\"plan ${expired ? '' : 'current'}\">\n          \u003cdiv class=\"plan-top\">\u003ch3>${esc(d.label)}\u003c/h3>\u003cspan class=\"price\">${expired ? 'Expired' : 'Active'}\u003c/span>\u003c/div>\n          \u003cul>\n            \u003cli class=\"${d.scope.titles ? '' : 'off'}\">Page titles\u003c/li>\n            \u003cli class=\"${d.scope.urls ? '' : 'off'}\">Full URLs\u003c/li>\n            \u003cli class=\"${d.scope.downloads ? '' : 'off'}\">Download list\u003c/li>\n            \u003cli>Expires ${new Date(d.expiresAt).toLocaleDateString()} · ${Math.max(0, Math.ceil((d.expiresAt - Date.now()) / 86400000))} days left\u003c/li>\n          \u003c/ul>\n          \u003cdiv class=\"plan-actions\">\n            \u003cbutton class=\"mini-btn accent\" data-act=\"delegateGenerate\">${code ? 'Regenerate code' : 'Generate code'}\u003c/button>\n            \u003cbutton class=\"mini-btn\" data-act=\"copy\" data-target=\"delegCode\">Copy\u003c/button>\n            \u003cbutton class=\"mini-btn danger\" data-act=\"delegateRevoke\">Revoke\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"delegCode\" class=\"code-box\">${code ? esc(code) : 'No code generated yet — tap Generate code to bundle ' + S.history.items.length + ' entries.'}\u003c/div>\n      ` : `\n        \u003cdiv class=\"list\">\n          \u003cdiv class=\"field\">\u003clabel>Delegate name\u003c/label>\u003cinput id=\"delegName\" type=\"text\" placeholder=\"Sam — family iPad\" value=\"${esc(S.delegation.pending.label)}\">\u003c/div>\n          \u003cdiv class=\"list-row\">\u003cspan class=\"lr-body\">\u003cb>Scope\u003c/b>\u003csmall>Grant the minimum you need\u003c/small>\u003c/span>\u003c/div>\n          \u003cdiv class=\"chips\">\n            ${['titles', 'urls', 'downloads'].map((k) => `\u003cbutton class=\"chip\" data-act=\"delegScope\" data-scope=\"${k}\" aria-pressed=\"${S.delegation.pending.scope[k]}\">${k[0].toUpperCase() + k.slice(1)}\u003c/button>`).join('')}\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"banner\">${ico('lock')}\u003cdiv>\u003cb>Delegation needs Premium\u003c/b>\u003cspan>Free profiles can export a history file; Premium and Ultimate can issue expiring codes and delegate to other devices.\u003c/span>\u003c/div>\u003c/div>\n        \u003cbutton class=\"accent-btn\" data-act=\"delegateCreate\">Create delegation\u003c/button>\n      `}\n\n      \u003cdiv class=\"section-label\">Import from another device\u003c/div>\n      \u003cdiv class=\"field\">\n        \u003ctextarea id=\"importCode\" placeholder=\"TiD1.…\">\u003c/textarea>\n        \u003cspan class=\"hint\">Paste a code you were given. Expired codes are rejected.\u003c/span>\n      \u003c/div>\n      \u003cbutton class=\"mini-btn accent\" data-act=\"delegateImport\">Import code\u003c/button>\n\n      \u003cdiv class=\"section-label\">Access log\u003c/div>\n      \u003cdiv class=\"list\">\n        ${S.delegation.log.length ? S.delegation.log.slice(0, 8).map((l) => `\u003cdiv class=\"list-row\">\u003cspan class=\"lr-body\">\u003cb style=\"font-weight:500;font-size:13px\">${esc(l.text)}\u003c/b>\u003csmall>${new Date(l.ts).toLocaleString()}\u003c/small>\u003c/span>\u003c/div>`).join('') : '\u003cdiv class=\"empty\">No delegation activity yet.\u003c/div>'}\n      \u003c/div>`\n  };\n};\n\n/* ---------------- account ---------------- */\nPANELS.account = () => {\n  const a = S.account;\n  return {\n    title: 'Account',\n    html: a ? `\n      \u003cdiv class=\"list-row\" style=\"border:1px solid var(--line);border-radius:14px;padding:16px\">\n        \u003cspan class=\"lr-icon\" style=\"width:48px;height:48px;border-radius:14px;background:hsl(${hueFor(a.name)} 45% 40%);color:#fff;font-weight:800;font-size:18px\">${esc(a.name[0].toUpperCase())}\u003c/span>\n        \u003cspan class=\"lr-body\">\u003cb>${esc(a.name)}${a.guest ? ' · guest' : ''}\u003c/b>\u003csmall>${esc(a.email || 'No email set')} · member since ${new Date(a.createdAt).toLocaleDateString()}\u003c/small>\u003c/span>\n        \u003cspan class=\"perm\">${PLANS[S.plan].name}\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"list\">\n        \u003cdiv class=\"field\">\u003clabel>Display name\u003c/label>\u003cinput id=\"acctName\" type=\"text\" value=\"${esc(a.name)}\" maxlength=\"40\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>Email\u003c/label>\u003cinput id=\"acctEmail\" type=\"email\" value=\"${esc(a.email)}\" placeholder=\"you@example.com\">\u003c/div>\n        \u003cdiv class=\"chips\">\u003cbutton class=\"mini-btn accent\" data-act=\"accountSave\">Save profile\u003c/button>\u003cbutton class=\"mini-btn\" data-act=\"sheet\" data-panel=\"plans\">Manage plan\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"section-label\">This device\u003c/div>\n      \u003cdiv class=\"list\">\n        \u003cdiv class=\"list-row\">\u003cspan class=\"lr-icon\">${ico(S.device === 'mobile' ? 'mobile' : 'monitor')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>${deviceName()} · this browser\u003c/b>\u003csmall>Last active now · local session\u003c/small>\u003c/span>\u003cspan class=\"dot on\">\u003c/span>\u003c/div>\n        \u003cdiv class=\"list-row\">\u003cspan class=\"lr-icon\">${ico('download')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>Export my data\u003c/b>\u003csmall>Settings, history and shortcuts as JSON\u003c/small>\u003c/span>\u003cbutton class=\"mini-btn\" data-act=\"exportData\">Export\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"list\">\n        \u003cbutton class=\"list-row\" data-act=\"signout\">\u003cspan class=\"lr-icon\">${ico('power')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>Sign out of this profile\u003c/b>\u003csmall>Keeps history and settings on the device\u003c/small>\u003c/span>\u003c/button>\n        \u003cbutton class=\"list-row\" data-act=\"reset\">\u003cspan class=\"lr-icon\" style=\"color:var(--danger)\">${ico('trash')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>Delete local profile\u003c/b>\u003csmall>Removes everything Titanium stored\u003c/small>\u003c/span>\u003c/button>\n      \u003c/div>\n    ` : `\n      \u003cp class=\"step-sub\">Titanium profiles are local. Nothing is uploaded and there is no password to forget.\u003c/p>\n      \u003cdiv class=\"list\">\n        \u003cdiv class=\"field\">\u003clabel>Display name\u003c/label>\u003cinput id=\"newName\" type=\"text\" placeholder=\"Alex Rivera\" maxlength=\"40\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>Email (optional)\u003c/label>\u003cinput id=\"newEmail\" type=\"email\" placeholder=\"you@example.com\">\u003c/div>\n        \u003cdiv class=\"chips\">\u003cbutton class=\"mini-btn accent\" data-act=\"accountCreate\">Create profile\u003c/button>\u003c/div>\n      \u003c/div>`\n  };\n};\n\n/* ---------------- plans ---------------- */\nconst PLAN_FEATURES = {\n  free: {\n    yes: ['All 15 search engines with real icons', 'Every theme, accent and layout control', 'Balanced ad & tracker blocking', 'Safe Browsing', '3 VPN locations', '2 Chrome extensions', '7-day history', '4 shortcuts', 'Mobile + desktop layouts'],\n    no: ['Strict blocking & custom filters', 'Delegation codes', 'Kill switch', 'Split tunneling']\n  },\n  premium: {\n    yes: ['Everything in Free', 'Strict blocking + custom filter rules', '12 VPN locations + kill switch', '10 Chrome extensions', '90-day history', 'History delegation (1 delegate)', '12 shortcuts', '20 tabs'],\n    no: ['Aggressive blocking', 'Split tunneling', 'Custom search engine']\n  },\n  ultimate: {\n    yes: ['Everything in Premium', 'Aggressive blocking + miner protection', 'All 16 VPN locations + split tunneling', 'Unlimited extensions', '1-year history', 'Up to 5 delegates', 'Custom search engine', 'Unlimited tabs', 'Priority support'],\n    no: []\n  }\n};\n\nPANELS.plans = () => ({\n  title: 'Plans',\n  html: `\n    \u003cp class=\"step-sub\">Start free forever. Upgrade when the limits start to pinch — downgrade any time, and your local data always comes with you.\u003c/p>\n    ${['free', 'premium', 'ultimate'].map((id) => {\n      const p = PLANS[id];\n      const f = PLAN_FEATURES[id];\n      const current = S.plan === id;\n      return `\u003cdiv class=\"plan ${current ? 'current' : ''}\">\n        \u003cdiv class=\"plan-top\">\n          \u003cdiv>\u003ch3>${p.name}\u003c/h3>\u003csmall style=\"color:var(--muted)\">${p.blurb}\u003c/small>\u003c/div>\n          \u003cspan class=\"price\">${p.price}\u003cspan style=\"color:var(--muted);font-weight:500\"> /${p.per}\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cul>${f.yes.map((x) => `\u003cli>${esc(x)}\u003c/li>`).join('')}${f.no.map((x) => `\u003cli class=\"off\">${esc(x)}\u003c/li>`).join('')}\u003c/ul>\n        \u003cdiv class=\"plan-actions\">\n          ${current ? '\u003cbutton class=\"mini-btn\" disabled>Current plan\u003c/button>' : `\u003cbutton class=\"mini-btn accent\" data-act=\"upgrade\" data-plan=\"${id}\">${RANK[id] > RANK[S.plan] ? 'Upgrade to ' + p.name : 'Switch to ' + p.name}\u003c/button>`}\n          ${id !== 'free' && !current ? '\u003cbutton class=\"mini-btn\" data-act=\"sheet\" data-panel=\"about\">What is included?\u003c/button>' : ''}\n        \u003c/div>\n      \u003c/div>`;\n    }).join('')}\n    \u003cdiv class=\"banner\">${ico('info')}\u003cdiv>\u003cb>Demo checkout\u003c/b>\u003cspan>No card, no charge. Picking a plan flips the local entitlement flag so you can try every gated feature; a real build would verify a receipt from the store.\u003c/span>\u003c/div>\u003c/div>`\n});\n\n/* ---------------- extensions ---------------- */\nPANELS.extensions = () => ({\n  title: 'Extensions',\n  html: window.Ext ? Ext.panelHTML() : '\u003cdiv class=\"empty\">\u003cb>Extension host loading…\u003c/b>\u003c/div>',\n  bind: (root) => { if (window.Ext) Ext.bind(root); }\n});\n\n/* ---------------- about ---------------- */\nPANELS.about = () => ({\n  title: 'About',\n  html: `\n    \u003cdiv class=\"list-row\" style=\"border:1px solid var(--line);border-radius:14px;padding:16px\">\n      \u003cspan class=\"lr-icon\" style=\"width:46px;height:46px;border-radius:14px;font-weight:800;font-size:15px;color:var(--accent)\">Ti\u003c/span>\n      \u003cspan class=\"lr-body\">\u003cb>Titanium ${VERSION}\u003c/b>\u003csmall>Single-file browser · MIT licence · open source\u003c/small>\u003c/span>\n    \u003c/div>\n    \u003cp class=\"step-sub\">Titanium is a browsing surface that fits in one HTML file: a start page, tabbed navigation, 15 search engines, ad blocking controls, a VPN surface, extension loading, history with delegation, and three plans. Every byte of state lives in your browser's localStorage.\u003c/p>\n    \u003cdiv class=\"section-label\">What's inside\u003c/div>\n    \u003cul style=\"margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.9\">\n      \u003cli>Five-question onboarding, device-adaptive layout\u003c/li>\n      \u003cli>Tabs with back stack, voice search, shortcuts\u003c/li>\n      \u003cli>15 engines + custom engine (Ultimate)\u003c/li>\n      \u003cli>Ad blocking levels, custom filters, Safe Browsing\u003c/li>\n      \u003cli>VPN location picker, protocol, kill switch\u003c/li>\n      \u003cli>History retention, private-by-default, delegation codes\u003c/li>\n      \u003cli>Chrome extension loader (.zip, .crx, unpacked folder)\u003c/li>\n      \u003cli>Free / Premium / Ultimate entitlements\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"section-label\">Honest limits\u003c/div>\n    \u003cdiv class=\"banner\">${ico('info')}\u003cdiv>\u003cb>What one HTML file can't do\u003c/b>\u003cspan>It can't create a real encrypted VPN tunnel, strip a site's anti-embedding headers, or run Chrome's background service workers. Those need a native shell or a browser extension build — the README explains the path for each.\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv class=\"section-label\">Credits\u003c/div>\n    \u003cdiv class=\"list\">\n      \u003ca class=\"list-row\" href=\"source.html\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"lr-icon\">${ico('code')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>Source code\u003c/b>\u003csmall>Every file, editable and downloadable\u003c/small>\u003c/span>\u003cspan class=\"chev\">›\u003c/span>\u003c/a>\n      \u003ca class=\"list-row\" href=\"https://github.com/your-username/titanium\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"lr-icon\">${ico('download')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>Project on GitHub\u003c/b>\u003csmall>Issues, roadmap and contributing\u003c/small>\u003c/span>\u003cspan class=\"chev\">›\u003c/span>\u003c/a>\n      \u003cdiv class=\"list-row\">\u003cspan class=\"lr-icon\">${ico('shield')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>Privacy\u003c/b>\u003csmall>No analytics, no accounts server, no telemetry\u003c/small>\u003c/span>\u003c/div>\n      \u003cdiv class=\"list-row\">\u003cspan class=\"lr-icon\">${ico('star')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>MIT licence\u003c/b>\u003csmall>Fork it, ship it, rename it\u003c/small>\u003c/span>\u003c/div>\n    \u003c/div>`\n});\n\n/* ---------------- shortcuts ---------------- */\nPANELS.shortcuts = () => ({\n  title: 'Start page shortcuts',\n  html: `\n    \u003cp class=\"step-sub\">Shortcuts appear under the search bar. Free keeps ${LIMITS ? '4' : '4'}, Premium 12, Ultimate 12.\u003c/p>\n    \u003cdiv class=\"list\">\n      ${S.shortcuts.length ? S.shortcuts.map((s, i) => `\u003cdiv class=\"list-row\">\n        \u003cspan class=\"lr-icon\" style=\"background:transparent\">${brandMarkForUrl(s.url, 22, s.name)}\u003c/span>\n        \u003cspan class=\"lr-body\">\u003cb>${esc(s.name)}\u003c/b>\u003csmall>${esc(s.url)}\u003c/small>\u003c/span>\n        \u003cbutton class=\"mini-btn danger\" data-act=\"shortcutDel\" data-index=\"${i}\">Remove\u003c/button>\n      \u003c/div>`).join('') : '\u003cdiv class=\"empty\">No shortcuts yet.\u003c/div>'}\n    \u003c/div>\n    \u003cbutton class=\"accent-btn\" data-act=\"shortcutAdd\">Add shortcut\u003c/button>`\n});\n","src/actions.js":"'use strict';\n/* ============================================================\n   Titanium — action dispatcher\n   ============================================================ */\n\nfunction paywall(need) {\n  const target = need || 'premium';\n  openModal(`\u003ch3>${target === 'ultimate' ? 'Ultimate' : 'Premium'} feature\u003c/h3>\n    \u003cp>This one is part of ${PLANS[target].name}. You're on ${PLANS[S.plan].name}. Switch plans instantly in this demo — no card, no charge.\u003c/p>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"ghost-btn\" data-act=\"modalClose\">Not now\u003c/button>\n      \u003cbutton class=\"primary-btn\" data-act=\"upgrade\" data-plan=\"${target}\">Try ${PLANS[target].name}\u003c/button>\n    \u003c/div>`);\n}\n\nconst ACTIONS = {\n  sheet: (el) => openSheet(el.dataset.panel),\n  modalClose: () => closeModal(),\n  paywall: (el) => paywall(el.dataset.need),\n\n  toggle: (el) => {\n    const path = el.dataset.path;\n    if (el.dataset.need && !can(el.dataset.need)) { paywall(el.dataset.need); return; }\n    const next = !getPath(path);\n    setPath(path, next);\n    if (path === 'home.shortcuts') S.home.shortcuts = next;\n    save();\n    applySettings();\n    renderHome();\n    renderSheet(true);\n    toast(`${next ? 'On' : 'Off'} · ${path.split('.').pop()}`);\n  },\n\n  input: (el) => {\n    const path = el.dataset.input;\n    let value = el.type === 'range' ? Number(el.value) : el.value;\n\n    if (path === 'theme.accent') {\n      S.theme.accent = value;\n      S.theme.accentId = 'custom';\n      S.theme.preset = 'custom';\n      save(); applySettings(); renderSheet(true);\n      return;\n    }\n    if (path.startsWith('customEngine.')) {\n      if (!can('ultimate')) { paywall('ultimate'); return; }\n    }\n    if (path === 'theme.radius' || path === 'theme.font') {\n      setPath(path, value);\n      const out = el.parentElement.querySelector('output');\n      if (out) out.textContent = path === 'theme.radius' ? value + 'px' : value + 'px';\n      save(); applySettings();\n      return;\n    }\n    setPath(path, value);\n    save();\n    applySettings();\n    renderHome();\n    if (path === 'vpn.protocol') { toast('Protocol set to ' + value); renderSheet(true); }\n  },\n\n  theme: (el) => {\n    S.theme.mode = el.dataset.theme;\n    S.theme.preset = 'custom';\n    save(); applySettings(); renderSheet(true);\n  },\n\n  accent: (el) => {\n    const a = ACCENTS.find((x) => x.id === el.dataset.accent);\n    if (!a) return;\n    S.theme.accentId = a.id;\n    S.theme.accent = a.color;\n    S.theme.preset = 'custom';\n    save(); applySettings(); renderSheet(true);\n  },\n\n  preset: (el) => {\n    const preset = LOOK_PRESETS[el.dataset.preset];\n    if (!preset) return;\n    S.theme = { ...S.theme, ...preset, preset: el.dataset.preset };\n    save(); applySettings(); renderHome(); renderSheet(true);\n    toast(`${el.textContent} look applied`);\n  },\n\n  shape: (el) => {\n    S.theme.searchShape = el.dataset.shape;\n    save(); applySettings(); renderSheet(true);\n  },\n\n  iconStyle: (el) => {\n    S.theme.iconStyle = el.dataset.icons;\n    save(); applySettings(); renderSheet(true);\n  },\n\n  openSource: () => {\n    window.open('source.html', '_blank', 'noopener');\n  },\n\n  density: (el) => {\n    S.theme.density = el.dataset.density;\n    document.documentElement.dataset.density = S.theme.density;\n    save(); renderSheet(true);\n  },\n\n  device: (el) => {\n    S.device = el.dataset.device;\n    save(); applySettings(); renderSheet(true); renderHome();\n    toast(S.device === 'mobile' ? 'Mobile layout' : 'Desktop layout');\n  },\n\n  engine: (el) => {\n    S.engine = el.dataset.engine;\n    S.customEngine = { name: '', url: '' };\n    save(); renderHome(); renderSheet(true);\n    toast(`Searching with ${engine().name}`);\n  },\n\n  useCustom: () => {\n    if (!can('ultimate')) { paywall('ultimate'); return; }\n    if (!S.customEngine.name || !S.customEngine.url.includes('%s')) { toast('Add a name and a URL containing %s'); return; }\n    save(); renderHome(); renderSheet(true); toast(`Searching with ${S.customEngine.name}`);\n  },\n\n  clearCustom: () => {\n    S.customEngine = { name: '', url: '' };\n    save(); renderHome(); renderSheet(true);\n  },\n\n  adblock: (el) => {\n    const level = el.dataset.level;\n    const need = level === 'aggressive' ? 'ultimate' : level === 'strict' ? 'premium' : 'free';\n    if (!can(need)) { paywall(need); return; }\n    S.privacy.adblock = level;\n    save(); renderHome(); renderSheet(true);\n    toast(level === 'off' ? 'Ad blocking off' : `${level} blocking on`);\n  },\n\n  retention: (el) => {\n    if (el.dataset.need && !can(el.dataset.need)) { paywall(el.dataset.need); return; }\n    S.history.retention = Number(el.dataset.days);\n    pruneHistory(); save(); renderHome(); renderSheet(true);\n  },\n\n  server: (el) => {\n    S.vpn.server = el.dataset.server;\n    save(); renderHome(); renderSheet(true);\n    if (S.vpn.on) toast(`Reconnected to ${serverName(S.vpn.server)}`);\n  },\n\n  vpnToggle: () => {\n    if (!S.vpn.on) {\n      toast('Connecting…');\n      setTimeout(() => {\n        S.vpn.on = true; save(); renderHome();\n        if (sheetStack[sheetStack.length - 1] === 'vpn') renderSheet(true);\n        toast(`Tunnel up · ${serverName(S.vpn.server)} (simulated)`);\n      }, 700);\n      return;\n    }\n    S.vpn.on = false;\n    save(); renderHome();\n    if (sheetStack[sheetStack.length - 1] === 'vpn') renderSheet(true);\n    toast('VPN disconnected');\n  },\n\n  upgrade: (el) => {\n    const id = el.dataset.plan;\n    if (id === S.plan) { closeModal(); return; }\n    openModal(`\u003ch3>Switch to ${PLANS[id].name}?\u003c/h3>\n      \u003cp>${PLANS[id].price}/${PLANS[id].per} in a real build. In this demo the plan flips instantly and every gated feature unlocks — nothing is charged and no card is collected.\u003c/p>\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"ghost-btn\" data-act=\"modalClose\">Cancel\u003c/button>\u003cbutton class=\"primary-btn\" data-act=\"confirmPlan\" data-plan=\"${id}\">Use ${PLANS[id].name}\u003c/button>\u003c/div>`);\n  },\n\n  confirmPlan: (el) => {\n    const id = el.dataset.plan;\n    S.plan = id;\n    S.history.retention = Math.min(S.history.retention, LIMITS.retention[id]);\n    if (!can('premium')) S.history.retention = Math.min(S.history.retention, LIMITS.retention.free);\n    pruneHistory();\n    save(); closeModal(); applySettings(); renderHome(); renderSheet(true);\n    toast(`${PLANS[id].name} active — everything unlocked`);\n  },\n\n  accountCreate: () => {\n    const name = $('#newName')?.value.trim();\n    const email = $('#newEmail')?.value.trim() || '';\n    if (!name) { toast('Add a display name'); return; }\n    S.account = { name, email, guest: false, createdAt: Date.now() };\n    save(); renderHome(); renderSheet(true); toast('Profile created');\n  },\n\n  accountSave: () => {\n    const name = $('#acctName')?.value.trim();\n    const email = $('#acctEmail')?.value.trim() || '';\n    if (!name) { toast('Add a display name'); return; }\n    S.account = { ...(S.account || { createdAt: Date.now() }), name, email };\n    save(); renderHome(); renderSheet(true); toast('Profile saved');\n  },\n\n  signout: () => {\n    S.account = null;\n    save(); renderHome(); renderSheet(true); toast('Signed out — history kept on device');\n  },\n\n  exportData: () => {\n    const blob = new Blob([JSON.stringify({ app: 'titanium', version: VERSION, exported: new Date().toISOString(), state: S }, null, 2)], { type: 'application/json' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'titanium-export.json';\n    a.click();\n    URL.revokeObjectURL(a.href);\n    toast('Export downloaded');\n  },\n\n  openHist: (el) => { navigate(el.dataset.url); closeSheet(); },\n  deleteHist: (el) => {\n    S.history.items = S.history.items.filter((h) => h.id !== el.dataset.id);\n    save(); renderHome(); renderSheet(true);\n  },\n  clearHistory: () => {\n    openModal(`\u003ch3>Clear history?\u003c/h3>\u003cp>Removes all ${S.history.items.length} entries from this device. Settings and shortcuts stay.\u003c/p>\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"ghost-btn\" data-act=\"modalClose\">Cancel\u003c/button>\u003cbutton class=\"primary-btn\" data-act=\"confirmClearHistory\">Clear\u003c/button>\u003c/div>`);\n  },\n  confirmClearHistory: () => {\n    S.history.items = [];\n    S.delegation.log.unshift({ ts: Date.now(), text: 'History cleared by you' });\n    save(); closeModal(); renderHome(); renderSheet(true); toast('History cleared');\n  },\n\n  clearData: () => {\n    S.history.items = [];\n    S.delegation.log.unshift({ ts: Date.now(), text: 'Cookies and history cleared' });\n    save(); renderHome(); renderSheet(true); toast('History and cookie state cleared');\n  },\n\n  delegScope: (el) => {\n    const k = el.dataset.scope;\n    S.delegation.pending.scope[k] = !S.delegation.pending.scope[k];\n    save(); renderSheet(true);\n  },\n  delegateCreate: () => {\n    if (!can('premium')) { paywall('premium'); return; }\n    const label = $('#delegName')?.value.trim() || 'Trusted device';\n    S.delegation.pending.label = label;\n    S.delegation.active = {\n      label,\n      scope: { ...S.delegation.pending.scope },\n      createdAt: Date.now(),\n      expiresAt: Date.now() + S.delegation.pending.days * 86400000,\n      code: null\n    };\n    S.delegation.log.unshift({ ts: Date.now(), text: `Delegation granted to ${label}` });\n    save(); renderSheet(true);\n    toast('Delegation created');\n  },\n  delegateGenerate: () => {\n    if (!S.delegation.active) return;\n    const code = buildDelegationCode();\n    S.delegation.active.code = code;\n    S.delegation.log.unshift({ ts: Date.now(), text: `Code generated for ${S.delegation.active.label}` });\n    save(); renderSheet(true);\n    toast(`Code ready · ${S.history.items.length} entries`);\n  },\n  delegateRevoke: () => {\n    if (!S.delegation.active) return;\n    S.delegation.log.unshift({ ts: Date.now(), text: `Delegation revoked for ${S.delegation.active.label}` });\n    S.delegation.active = null;\n    save(); renderSheet(true); toast('Delegation revoked');\n  },\n  delegateImport: () => {\n    const code = $('#importCode')?.value || '';\n    const res = importDelegation(code);\n    if (!res.ok) { toast(res.error); return; }\n    renderSheet(true); toast(`Imported ${res.count} entries`);\n  },\n\n  copy: async (el) => {\n    const node = document.getElementById(el.dataset.target);\n    if (!node) return;\n    try { await navigator.clipboard.writeText(node.textContent.trim()); toast('Copied'); }\n    catch { toast('Copy failed — select the code and copy manually'); }\n  },\n\n  switchTab: (el) => { switchTab(el.dataset.id); closeSheet(); },\n  closeTab: (el) => {\n    closeTab(el.dataset.id);\n    if (!tabs.length) return;\n    renderSheet(true);\n  },\n  newtab: () => { newTab(); closeSheet(); },\n  closeOthers: () => {\n    tabs = tabs.filter((t) => t.id === activeId);\n    renderTopbar(); renderSheet(true); toast('Other tabs closed');\n  },\n\n  shortcutAdd: () => addShortcutDialog(),\n  shortcutDel: (el) => {\n    S.shortcuts.splice(Number(el.dataset.index), 1);\n    save(); renderHome(); renderSheet(true);\n  },\n\n  resetLook: () => {\n    S.theme = structuredClone(DEFAULT_STATE.theme);\n    save(); applySettings(); renderSheet(true); toast('Look reset');\n  },\n\n  reset: () => {\n    openModal(`\u003ch3>Reset Titanium?\u003c/h3>\u003cp>This wipes the local profile, history, shortcuts, extensions and settings. The page reloads into onboarding.\u003c/p>\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"ghost-btn\" data-act=\"modalClose\">Cancel\u003c/button>\u003cbutton class=\"primary-btn\" data-act=\"confirmReset\">Reset everything\u003c/button>\u003c/div>`);\n  },\n  confirmReset: async () => {\n    localStorage.removeItem(LS_KEY);\n    try {\n      const dbs = await indexedDB.databases?.();\n      (dbs || []).forEach((d) => d.name && indexedDB.deleteDatabase(d.name));\n    } catch { /* ignore */ }\n    location.reload();\n  }\n};\n\nwindow.ACTIONS = ACTIONS;\n","src/extensions.js":"'use strict';\n/* ============================================================\n   Titanium — Chrome extension host\n   Loads .zip / .crx / unpacked folders, reads manifest.json,\n   renders the extension popup in a sandboxed frame and answers\n   a chrome.* compatibility shim over postMessage.\n   ============================================================ */\n\nconst Ext = {\n  items: [],\n  ready: false,\n  DB: 'titanium-ext',\n  STORE: 'ext',\n  MAX_BYTES: 3 * 1024 * 1024\n};\n\n/* ---------- base64 \u003c-> bytes ---------- */\nfunction bytesToB64(u8) {\n  let bin = '';\n  const chunk = 0x8000;\n  for (let i = 0; i \u003c u8.length; i += chunk) bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));\n  return btoa(bin);\n}\nfunction b64ToBytes(b64) {\n  const bin = atob(b64);\n  const u8 = new Uint8Array(bin.length);\n  for (let i = 0; i \u003c bin.length; i++) u8[i] = bin.charCodeAt(i);\n  return u8;\n}\nconst decodeText = (u8) => new TextDecoder().decode(u8);\n\n/* ---------- zip reader (stored + deflate) ---------- */\nasync function unzip(buffer) {\n  const u8 = new Uint8Array(buffer);\n  const dv = new DataView(buffer);\n  if (u8.length \u003c 22) throw new Error('File is too small to be an archive');\n  let eocd = -1;\n  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {\n    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }\n  }\n  if (eocd \u003c 0) throw new Error('Not a valid ZIP or CRX file');\n  const count = dv.getUint16(eocd + 10, true);\n  let off = dv.getUint32(eocd + 16, true);\n  const files = {};\n  let total = 0;\n  for (let i = 0; i \u003c count; i++) {\n    if (dv.getUint32(off, true) !== 0x02014b50) break;\n    const method = dv.getUint16(off + 10, true);\n    const compSize = dv.getUint32(off + 20, true);\n    const nameLen = dv.getUint16(off + 28, true);\n    const extraLen = dv.getUint16(off + 30, true);\n    const commentLen = dv.getUint16(off + 32, true);\n    const localOff = dv.getUint32(off + 42, true);\n    const name = decodeText(u8.subarray(off + 46, off + 46 + nameLen));\n    off += 46 + nameLen + extraLen + commentLen;\n    if (name.endsWith('/')) continue;\n    const lnameLen = dv.getUint16(localOff + 26, true);\n    const lextraLen = dv.getUint16(localOff + 28, true);\n    const start = localOff + 30 + lnameLen + lextraLen;\n    const comp = u8.subarray(start, start + compSize);\n    total += compSize;\n    if (total > Ext.MAX_BYTES) throw new Error('Extension is larger than 3 MB');\n    let content;\n    if (method === 0) content = comp;\n    else if (method === 8) {\n      const stream = new Blob([comp]).stream().pipeThrough(new DecompressionStream('deflate-raw'));\n      content = new Uint8Array(await new Response(stream).arrayBuffer());\n    } else continue;\n    files[name] = content;\n  }\n  return files;\n}\n\nfunction stripCrx(buffer) {\n  const u8 = new Uint8Array(buffer);\n  if (u8[0] === 0x43 && u8[1] === 0x72 && u8[2] === 0x32 && u8[3] === 0x34) {\n    const dv = new DataView(buffer);\n    const version = dv.getUint32(4, true);\n    if (version === 3) return buffer.slice(12 + dv.getUint32(8, true));\n    return buffer.slice(16 + dv.getUint32(8, true) + dv.getUint32(12, true));\n  }\n  return buffer;\n}\n\n/* ---------- IndexedDB ---------- */\nfunction idb() {\n  return new Promise((resolve, reject) => {\n    const req = indexedDB.open(Ext.DB, 1);\n    req.onupgradeneeded = () => {\n      if (!req.result.objectStoreNames.contains(Ext.STORE)) req.result.createObjectStore(Ext.STORE, { keyPath: 'id' });\n    };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\nasync function idbAll() {\n  const db = await idb();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(Ext.STORE, 'readonly').objectStore(Ext.STORE).getAll();\n    tx.onsuccess = () => resolve(tx.result || []);\n    tx.onerror = () => reject(tx.error);\n  });\n}\nasync function idbPut(record) {\n  const db = await idb();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(Ext.STORE, 'readwrite').objectStore(Ext.STORE).put(record);\n    tx.onsuccess = () => resolve(true);\n    tx.onerror = () => reject(tx.error);\n  });\n}\nasync function idbDel(id) {\n  const db = await idb();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(Ext.STORE, 'readwrite').objectStore(Ext.STORE).delete(id);\n    tx.onsuccess = () => resolve(true);\n    tx.onerror = () => reject(tx.error);\n  });\n}\n\n/* ---------- manifest helpers ---------- */\nfunction i18nName(manifest, files) {\n  let name = manifest.name || 'Unnamed extension';\n  if (/^__MSG_(.+)__$/.test(name)) {\n    const key = name.replace(/^__MSG_|__$/g, '');\n    const locale = manifest.default_locale || 'en';\n    const candidates = [`_locales/${locale}/messages.json`, '_locales/en/messages.json'];\n    for (const path of candidates) {\n      const data = files[path];\n      if (!data) continue;\n      try {\n        const messages = JSON.parse(decodeText(data));\n        const entry = messages[key] || messages[key.toLowerCase()];\n        if (entry) {\n          name = typeof entry === 'string' ? entry : entry.message;\n          break;\n        }\n      } catch { /* keep raw name */ }\n    }\n  }\n  return name;\n}\n\nfunction pickIcon(manifest, files) {\n  const icons = manifest.icons || {};\n  const sizes = Object.keys(icons).map(Number).sort((a, b) => b - a);\n  for (const size of sizes) {\n    const p = icons[size];\n    if (files[p]) return 'data:image/png;base64,' + bytesToB64(files[p]);\n  }\n  return '';\n}\n\nfunction permissionList(manifest) {\n  const perms = [...(manifest.permissions || []), ...(manifest.host_permissions || [])];\n  const opt = manifest.optional_permissions || [];\n  return { perms: [...new Set([...perms, ...opt])].slice(0, 12), all: perms.length };\n}\n\n/* ---------- build an extension record ---------- */\nasync function recordFromFiles(fileMap, sourceLabel) {\n  let manifestPath = 'manifest.json';\n  if (!fileMap[manifestPath]) {\n    const nested = Object.keys(fileMap).find((p) => p.endsWith('/manifest.json') && p.split('/').length \u003c= 3);\n    if (!nested) throw new Error('No manifest.json found — is this a Chrome extension?');\n    manifestPath = nested;\n    const prefix = nested.slice(0, -'manifest.json'.length);\n    const trimmed = {};\n    for (const [p, v] of Object.entries(fileMap)) trimmed[p.replace(new RegExp('^' + prefix.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')), '')] = v;\n    fileMap = trimmed;\n  }\n  let manifest;\n  try { manifest = JSON.parse(decodeText(fileMap['manifest.json'])); }\n  catch { throw new Error('manifest.json could not be parsed'); }\n\n  const files = {};\n  let bytes = 0;\n  for (const [path, data] of Object.entries(fileMap)) {\n    bytes += data.length;\n    files[path] = bytesToB64(data);\n  }\n  if (bytes > Ext.MAX_BYTES) throw new Error('Extension is larger than 3 MB');\n\n  const id = 'ext' + uid();\n  return {\n    id,\n    name: i18nName(manifest, fileMap).slice(0, 60),\n    version: manifest.version || '0.0.0',\n    description: (manifest.description || 'No description').slice(0, 220),\n    manifestVersion: manifest.manifest_version || 2,\n    manifest,\n    permissions: permissionList(manifest).perms,\n    popupPath: (manifest.action && manifest.action.default_popup) || (manifest.browser_action && manifest.browser_action.default_popup) || '',\n    icon: pickIcon(manifest, fileMap),\n    contentScripts: (manifest.content_scripts || []).map((cs) => (cs.matches || []).join(', ')).slice(0, 3),\n    files,\n    enabled: true,\n    source: sourceLabel || 'local file',\n    installedAt: Date.now()\n  };\n}\n\n/* ---------- chrome shim for the popup frame ---------- */\nfunction shimFor(record) {\n  const messages = {};\n  const locales = Object.keys(record.files).filter((p) => p.startsWith('_locales/') && p.endsWith('/messages.json'));\n  for (const path of locales) {\n    try {\n      const parsed = JSON.parse(decodeText(b64ToBytes(record.files[path])));\n      for (const [k, v] of Object.entries(parsed)) messages[k] = typeof v === 'string' ? v : v.message || '';\n    } catch { /* ignore broken locale */ }\n  }\n  const safe = (obj) => JSON.stringify(obj).replace(/\u003c/g, '\\\\u003c');\n  return `\n(function(){\n  const MANIFEST = ${safe(record.manifest)};\n  const MESSAGES = ${safe(messages)};\n  const pending = new Map(); let seq = 0;\n  function call(method, args){\n    return new Promise(function(resolve, reject){\n      const id = ++seq; pending.set(id, {resolve: resolve, reject: reject});\n      parent.postMessage({ ti: 'ext-call', id: id, method: method, args: args || [] }, '*');\n    });\n  }\n  addEventListener('message', function(e){\n    const d = e.data || {};\n    if (d.ti !== 'ext-reply' || !pending.has(d.id)) return;\n    const p = pending.get(d.id); pending.delete(d.id);\n    if (d.error) p.reject(new Error(d.error)); else p.resolve(d.result);\n  });\n  function storage(){\n    return {\n      get: function(k){ return call('storage.get', [k]); },\n      set: function(o){ return call('storage.set', [o]); },\n      remove: function(k){ return call('storage.remove', [k]); },\n      clear: function(){ return call('storage.clear', []); }\n    };\n  }\n  const chrome = {\n    runtime: {\n      id: ${safe(record.id)},\n      getManifest: function(){ return MANIFEST; },\n      getURL: function(p){ return p; },\n      sendMessage: function(){ return Promise.resolve(undefined); },\n      onMessage: { addListener: function(){}, removeListener: function(){} },\n      onInstalled: { addListener: function(){} },\n      lastError: undefined\n    },\n    storage: { local: storage(), sync: storage(), session: storage() },\n    tabs: {\n      query: function(q){ return call('tabs.query', [q]); },\n      create: function(o){ return call('tabs.create', [o]); },\n      update: function(id, o){ return call('tabs.update', [id, o]); }\n    },\n    i18n: { getMessage: function(k){ return MESSAGES[k] || ''; } },\n    action: { setBadgeText: function(){}, setBadgeBackgroundColor: function(){}, onClicked: { addListener: function(){} } },\n    permissions: { contains: function(){ return Promise.resolve(true); }, request: function(){ return Promise.resolve(true); } }\n  };\n  window.chrome = chrome;\n  window.browser = chrome;\n})();`;\n}\n\nfunction popupDocument(record) {\n  const raw = record.files[record.popupPath];\n  if (!raw) return null;\n  let html = decodeText(b64ToBytes(raw));\n  const dir = record.popupPath.includes('/') ? record.popupPath.slice(0, record.popupPath.lastIndexOf('/') + 1) : '';\n  const read = (p) => {\n    const clean = p.replace(/^\\.\\//, '').replace(/^\\//, '');\n    const candidate = record.files[dir + clean] || record.files[clean];\n    return candidate ? decodeText(b64ToBytes(candidate)) : '';\n  };\n  html = html.replace(/\u003clink[^>]+rel=[\"']?stylesheet[\"']?[^>]*>/gi, (tag) => {\n    const m = tag.match(/href=[\"']([^\"']+)[\"']/i);\n    if (!m || /^(https?:)?\\/\\//i.test(m[1])) return tag;\n    const css = read(m[1]);\n    return css ? `\u003cstyle>${css}\u003c/style>` : tag;\n  });\n  html = html.replace(/\u003cscript([^>]*)\\ssrc=[\"']([^\"']+)[\"']([^>]*)>\u003c\\/script>/gi, (tag, pre, src, post) => {\n    if (/^(https?:)?\\/\\//i.test(src)) return tag;\n    const js = read(src);\n    return js ? `\u003cscript${pre}${post}>${js}\u003c\\/script>` : tag;\n  });\n  html = html.replace(/(\u003cimg[^>]+src=[\"'])([^\"']+)([\"'])/gi, (tag, a, src, b) => {\n    if (/^(https?:|data:)/i.test(src)) return tag;\n    const data = record.files[dir + src.replace(/^\\.\\//, '')];\n    return data ? `${a}data:image/png;base64,${data}${b}` : tag;\n  });\n  const shim = `\u003cscript>${shimFor(record)}\u003c\\/script>`;\n  if (/\u003chead[^>]*>/i.test(html)) html = html.replace(/\u003chead[^>]*>/i, (m) => m + shim);\n  else html = shim + html;\n  const base = '\u003cbase target=\"_blank\">';\n  return /\u003chead[^>]*>/i.test(html) ? html.replace(/\u003chead[^>]*>/i, (m) => m + base) : base + html;\n}\n\n/* ---------- chrome.* RPC ---------- */\nfunction extStoreKey(id) { return 'ti.extdata.' + id; }\nfunction readExtStore(id) {\n  try { return JSON.parse(localStorage.getItem(extStoreKey(id)) || '{}'); } catch { return {}; }\n}\nfunction writeExtStore(id, data) {\n  try { localStorage.setItem(extStoreKey(id), JSON.stringify(data)); } catch { toast('Extension storage is full'); }\n}\n\nfunction extStorageGet(id, keys) {\n  const all = readExtStore(id);\n  if (keys == null) return all;\n  if (typeof keys === 'string') return { [keys]: all[keys] };\n  if (Array.isArray(keys)) {\n    const out = {};\n    keys.forEach((k) => { out[k] = all[k]; });\n    return out;\n  }\n  const out = { ...keys };\n  Object.keys(keys).forEach((k) => { if (k in all) out[k] = all[k]; });\n  return out;\n}\n\nasync function handleExtCall(id, method, args) {\n  if (method.startsWith('storage.')) {\n    const all = readExtStore(id);\n    if (method === 'storage.get') return extStorageGet(id, args[0]);\n    if (method === 'storage.set') { writeExtStore(id, { ...all, ...(args[0] || {}) }); return undefined; }\n    if (method === 'storage.remove') {\n      const keys = Array.isArray(args[0]) ? args[0] : [args[0]];\n      keys.forEach((k) => delete all[k]);\n      writeExtStore(id, all);\n      return undefined;\n    }\n    if (method === 'storage.clear') { writeExtStore(id, {}); return undefined; }\n  }\n  if (method === 'tabs.query') {\n    const t = activeTab();\n    return [{ id: 1, active: true, url: t.url || 'titanium://start', title: t.url ? hostOf(t.url) : 'New tab', windowId: 1 }];\n  }\n  if (method === 'tabs.create') { newTab((args[0] || {}).url || null); return { id: tabs.length }; }\n  if (method === 'tabs.update') { navigate(args[1]?.url || 'about:blank'); return { id: 1 }; }\n  throw new Error('chrome.' + method + ' is not available in this build');\n}\n\nwindow.addEventListener('message', async (e) => {\n  const d = e.data || {};\n  if (d.ti !== 'ext-call') return;\n  const frame = document.querySelector('iframe[data-ext]');\n  if (!frame || e.source !== frame.contentWindow) return;\n  try {\n    const result = await handleExtCall(frame.dataset.ext, d.method, d.args || []);\n    e.source.postMessage({ ti: 'ext-reply', id: d.id, result }, '*');\n  } catch (err) {\n    e.source.postMessage({ ti: 'ext-reply', id: d.id, error: String(err && err.message || err) }, '*');\n  }\n});\n\n/* ---------- install ---------- */\nasync function installExtension(fileMap, sourceLabel) {\n  const cap = LIMITS.extensions[S.plan] || 2;\n  if (Ext.items.length >= cap) {\n    paywall(S.plan === 'free' ? 'premium' : 'ultimate');\n    throw new Error(`Your plan allows ${cap} extensions`);\n  }\n  const record = await recordFromFiles(fileMap, sourceLabel);\n  await idbPut(record);\n  Ext.items.push(record);\n  save();\n  renderSheet(true);\n  toast(`${record.name} installed`);\n}\n\nasync function installFromFile(file) {\n  const buffer = await file.arrayBuffer();\n  const zip = stripCrx(buffer);\n  const files = await unzip(zip);\n  await installExtension(files, file.name);\n}\n\nasync function installFromFolder(fileList) {\n  const files = {};\n  for (const file of fileList) {\n    const path = (file.webkitRelativePath || file.name).split('/').slice(1).join('/') || file.name;\n    files[path] = new Uint8Array(await file.arrayBuffer());\n  }\n  await installExtension(files, 'unpacked folder');\n}\n\n/* ---------- UI ---------- */\nExt.panelHTML = () => {\n  const cap = LIMITS.extensions[S.plan];\n  const capLabel = cap === Infinity ? 'unlimited' : cap;\n  return `\n    \u003cdiv class=\"banner\">${ico('puzzle')}\u003cdiv>\u003cb>Chrome extensions, loaded locally\u003c/b>\u003cspan>Drop in a \u003ccode>.crx\u003c/code> or \u003ccode>.zip\u003c/code> from the Chrome Web Store, or point at an unpacked folder. Titanium reads manifest.json, renders the popup and answers \u003ccode>chrome.storage\u003c/code>, \u003ccode>chrome.runtime\u003c/code> and \u003ccode>chrome.tabs\u003c/code> through a compatibility shim.\u003c/span>\u003c/div>\u003c/div>\n\n    \u003cdiv class=\"banner\">${ico('info')}\u003cdiv>\u003cb>What can't run in one HTML file\u003c/b>\u003cspan>MV3 background service workers and content scripts injected into cross-origin sites need Chrome's process model. Extension popups, storage, options pages and tab metadata do work. Pages load inside a sandbox, so review what you install.\u003c/span>\u003c/div>\u003c/div>\n\n    \u003cdiv class=\"plan-actions\">\n      \u003cbutton class=\"mini-btn accent\" data-ext=\"add\">Add extension (.crx / .zip)\u003c/button>\n      \u003cbutton class=\"mini-btn\" data-ext=\"folder\">Load unpacked\u003c/button>\n      \u003cspan class=\"perm\">${Ext.items.length} / ${capLabel} used · ${S.plan}\u003c/span>\n    \u003c/div>\n    \u003cinput type=\"file\" id=\"extFile\" accept=\".crx,.zip,application/zip\" hidden>\n    \u003cinput type=\"file\" id=\"extFolder\" webkitdirectory directory multiple hidden>\n\n    \u003cdiv class=\"section-label\">Installed\u003c/div>\n    ${Ext.items.length ? Ext.items.map((x) => `\n      \u003cdiv class=\"ext-card\">\n        \u003cdiv class=\"ext-head\">\n          \u003cspan class=\"ext-logo\" style=\"background:transparent;overflow:hidden\">${x.icon ? `\u003cimg src=\"${x.icon}\" alt=\"\" style=\"width:32px;height:32px\">` : esc((x.name[0] || 'E').toUpperCase())}\u003c/span>\n          \u003cspan class=\"ext-body\">\u003cb>${esc(x.name)}\u003c/b>\u003csmall>v${esc(x.version)} · MV${x.manifestVersion} · ${esc(x.source)}\u003c/small>\u003c/span>\n          \u003cbutton class=\"toggle\" data-ext=\"toggle\" data-id=\"${x.id}\" aria-pressed=\"${x.enabled}\" aria-label=\"Enable\">\u003c/button>\n        \u003c/div>\n        \u003cp style=\"margin:0;color:var(--muted);font-size:12.5px\">${esc(x.description)}\u003c/p>\n        \u003cdiv class=\"perm-list\">${x.permissions.length ? x.permissions.map((p) => `\u003cspan class=\"perm\">${esc(p)}\u003c/span>`).join('') : '\u003cspan class=\"perm\">no special permissions\u003c/span>'}\u003c/div>\n        \u003cdiv class=\"plan-actions\">\n          ${x.popupPath ? `\u003cbutton class=\"mini-btn accent\" data-ext=\"popup\" data-id=\"${x.id}\">Open popup\u003c/button>` : '\u003cspan class=\"perm\">no popup\u003c/span>'}\n          \u003cbutton class=\"mini-btn danger\" data-ext=\"remove\" data-id=\"${x.id}\">Remove\u003c/button>\n        \u003c/div>\n        ${x.contentScripts && x.contentScripts.length ? `\u003csmall style=\"color:var(--muted-2);font-size:11px\">Content scripts declared for: ${esc(x.contentScripts.join(' · '))} (not injected by this build)\u003c/small>` : ''}\n      \u003c/div>`).join('') : `\u003cdiv class=\"empty\">\u003cb>No extensions yet\u003c/b>Install a CRX or ZIP to see its popup run here.\u003c/div>`}\n\n    \u003cp class=\"hint\" style=\"color:var(--muted-2);font-size:11.5px\">Extensions are stored in IndexedDB on this device. Removing one deletes its files and its chrome.storage data.\u003c/p>`;\n};\n\nExt.bind = (root) => {\n  const fileInput = $('#extFile', root);\n  const folderInput = $('#extFolder', root);\n  $$('[data-ext]', root).forEach((node) => {\n    const kind = node.dataset.ext;\n    if (kind === 'add') node.addEventListener('click', () => fileInput.click());\n    if (kind === 'folder') node.addEventListener('click', () => folderInput.click());\n    if (kind === 'toggle') node.addEventListener('click', async () => {\n      const item = Ext.items.find((x) => x.id === node.dataset.id);\n      if (!item) return;\n      item.enabled = !item.enabled;\n      node.setAttribute('aria-pressed', String(item.enabled));\n      await idbPut(item);\n      toast(`${item.name} ${item.enabled ? 'enabled' : 'disabled'}`);\n    });\n    if (kind === 'remove') node.addEventListener('click', async () => {\n      const item = Ext.items.find((x) => x.id === node.dataset.id);\n      if (!item) return;\n      openModal(`\u003ch3>Remove ${esc(item.name)}?\u003c/h3>\u003cp>Its files and stored data are deleted from this device.\u003c/p>\n        \u003cdiv class=\"modal-actions\">\u003cbutton class=\"ghost-btn\" data-act=\"modalClose\">Cancel\u003c/button>\u003cbutton class=\"primary-btn\" data-ext=\"removeConfirm\" data-id=\"${item.id}\">Remove\u003c/button>\u003c/div>`);\n      const confirmBtn = $('#modalCard [data-ext=\"removeConfirm\"]');\n      if (confirmBtn) confirmBtn.addEventListener('click', async () => {\n        await idbDel(item.id);\n        localStorage.removeItem(extStoreKey(item.id));\n        Ext.items = Ext.items.filter((x) => x.id !== item.id);\n        closeModal(); renderSheet(true); toast('Extension removed');\n      });\n    });\n    if (kind === 'popup') node.addEventListener('click', () => Ext.openPopup(node.dataset.id));\n  });\n\n  if (fileInput) fileInput.addEventListener('change', async () => {\n    const file = fileInput.files && fileInput.files[0];\n    if (!file) return;\n    toast('Reading ' + file.name + '…');\n    try { await installFromFile(file); }\n    catch (err) { toast(String(err.message || err)); }\n    fileInput.value = '';\n  });\n  if (folderInput) folderInput.addEventListener('change', async () => {\n    if (!folderInput.files || !folderInput.files.length) return;\n    toast('Reading folder…');\n    try { await installFromFolder(folderInput.files); }\n    catch (err) { toast(String(err.message || err)); }\n    folderInput.value = '';\n  });\n};\n\nExt.openPopup = async (id) => {\n  const record = Ext.items.find((x) => x.id === id);\n  if (!record) return;\n  if (!record.enabled) { toast('Enable the extension first'); return; }\n  const doc = popupDocument(record);\n  if (!doc) { toast('This extension has no popup page'); return; }\n  openModal(`\u003ch3 style=\"display:flex;align-items:center;gap:10px\">${esc(record.name)} \u003cspan class=\"perm\">popup\u003c/span>\u003c/h3>\n    \u003cdiv class=\"ext-popup-preview\">\u003ciframe data-ext=\"${record.id}\" sandbox=\"allow-scripts allow-forms allow-popups\" title=\"${esc(record.name)} popup\">\u003c/iframe>\u003c/div>\n    \u003cp style=\"font-size:11.5px\">Running in a sandbox with a chrome.* shim. Data written by the popup is kept per extension.\u003c/p>\n    \u003cdiv class=\"modal-actions\">\u003cbutton class=\"primary-btn\" data-act=\"modalClose\">Done\u003c/button>\u003c/div>`,\n    () => {\n      const frame = document.querySelector(`iframe[data-ext=\"${record.id}\"]`);\n      if (frame) frame.srcdoc = doc;\n    });\n};\n\nExt.init = async () => {\n  try {\n    Ext.items = (await idbAll()).map((rec) => ({\n      ...rec,\n      enabled: rec.enabled !== false,\n      permissions: rec.permissions || [],\n      contentScripts: rec.contentScripts || []\n    })).sort((a, b) => a.installedAt - b.installedAt);\n  } catch {\n    Ext.items = [];\n  }\n  Ext.ready = true;\n  if (sheetStack[sheetStack.length - 1] === 'extensions' && !$('#sheet').hidden) renderSheet(true);\n};\n\nwindow.Ext = Ext;\n","src/boot.js":"'use strict';\n/* ============================================================\n   Titanium — boot\n   ============================================================ */\n\nlet wired = false;\n\nfunction hideBoot() {\n  const boot = $('#boot');\n  if (!boot) return;\n  boot.classList.add('hide');\n  setTimeout(() => { boot.hidden = true; }, 380);\n}\n\nfunction startApp() {\n  $('#onboard').hidden = true;\n  $('#app').hidden = false;\n  applySettings();\n  renderTopbar();\n  renderHome();\n  renderView();\n  hideBoot();\n}\n\nfunction applyCssOverride() {\n  try {\n    const css = localStorage.getItem('ti.css.override');\n    if (!css) return;\n    const tag = document.createElement('style');\n    tag.id = 'ti-css-override';\n    tag.textContent = css;\n    document.head.appendChild(tag);\n  } catch { /* storage blocked */ }\n}\n\nfunction bootTitanium() {\n  applyCssOverride();\n  $('#onboardNext').addEventListener('click', obNext);\n  $('#onboardBack').addEventListener('click', obBack);\n  $('#skipOnboard').addEventListener('click', () => {\n    S.heardFrom = S.heardFrom || 'not specified';\n    S.onboarded = true;\n    S.account = S.account || { name: 'Guest', email: '', guest: true, createdAt: Date.now() };\n    save();\n    $('#onboard').hidden = true;\n    startApp();\n    toast('You can finish setup any time in the menu');\n  });\n\n  window.addEventListener('scroll', () => {\n    const top = window.scrollY || document.documentElement.scrollTop;\n    $('#topbar').classList.toggle('scrolled', top > 6);\n  }, { passive: true });\n\n  if (!wired) {\n    wire();\n    wired = true;\n  }\n\n  applySettings();\n\n  if (S.onboarded) {\n    startApp();\n  } else {\n    hideBoot();\n    startOnboarding();\n  }\n\n  Ext.init();\n}\n\nif (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootTitanium);\nelse bootTitanium();\n","src/styles.css":"/* ============================================================\n   Titanium — design system\n   Mobile-first. The screenshot look: near-black canvas, soft\n   charcoal cards, a blue-grey search pill and one accent hue.\n   ============================================================ */\n\n:root {\n  --bg: #15161a;\n  --bg-deep: #0e0f12;\n  --card: #23252a;\n  --card-2: #2a2d33;\n  --card-3: #33363d;\n  --line: rgba(255, 255, 255, .08);\n  --line-strong: rgba(255, 255, 255, .14);\n  --text: #f1f4f9;\n  --muted: #99a2b0;\n  --muted-2: #6f7887;\n  --accent: #8ab4f8;\n  --accent-ink: #0c1421;\n  --pill , var(--accent) 8%, transparent), transparent 55%),\n    var(--bg-deep);\n  color: var(--text);\n  font-family: var(--font);\n  font-size: 15px;\n  line-height: 1.45;\n  -webkit-font-smoothing: antialiased;\n}\n\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nsvg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }\n::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n/* ---------- boot ---------- */\n.boot {\n  position: fixed; inset: 0; z-index: 90; display: grid; align-content: center; justify-items: center; gap: 8px;\n  background: var(--bg-deep); transition: opacity .35s ease, visibility .35s;\n}\n.boot[hidden] { display: none; }\n.boot.hide { opacity: 0; visibility: hidden; pointer-events: none; }\n.boot-icon { width: 84px; height: 84px; border-radius: 22px; box-shadow: var(--shadow); }\n.boot-name { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin-top: 8px; }\n.boot-sub { color: var(--muted); font-size: 13px; }\n\n/* ---------- app shell ---------- */\n.app {\n  max-width: var(--shell-max);\n  margin: 0 auto;\n  min-height: 100dvh;\n  display: flex;\n  flex-direction: column;\n  background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 88%, var(--accent) 4%), var(--bg) 240px);\n  position: relative;\n}\n@media (min-width: 700px) {\n  .app {\n    min-height: calc(100dvh - 48px);\n    margin: 24px auto;\n    border: 1px solid var(--line);\n    border-radius: 30px;\n    overflow: hidden;\n    box-shadow: var(--shadow), 0 0 0 8px rgba(255, 255, 255, .02);\n  }\n}\nhtml[data-device=\"pc\"] .app { max-width: 1180px; min-height: 100dvh; margin: 0 auto; border-radius: 0; border: 0; box-shadow: none; }\nhtml[data-device=\"pc\"] .home { padding: 26px clamp(20px, 4vw, 52px) 40px; }\nhtml[data-device=\"pc\"] .homegrid  font-weight: 700; font-size: 13px;\n}\n.count-chip:hover { background: var(--card-2); }\n\n/* ---------- home ---------- */\n.stage { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }\n.home { padding: 6px var(--pad) 40px; display: flex; flex-direction: column; gap: var(--gap); }\n.home-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 2px; }\n.hello { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .01em; }\n.plan-pill {\n  border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);\n  border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700;\n}\n.plan-pill.ult { border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); }\n\n.searchpill {\n  display: flex; align-items: center; gap: 12px;\n  min-height: 60px; padding: 8px 10px 8px 12px;\n  background: var(--pill); border-radius: 999px;\n  border: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);\n  box-shadow: 0 10px 26px rgba(0, 0, 0, .22);\n}\n.searchpill:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }\n.engine-badge {\n  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;\n  display: grid; place-items: center; font-weight: 800; font-size: 15px;\n  color: #fff; background: #333;\n  box-shadow: 0 2px 8px rgba(0, 0, 0, .3);\n}\n.searchpill input {\n  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: var(--pill-ink);\n  font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; outline: none;\n}\n.searchpill input::placeholder { color: color-mix(in srgb, var(--pill-ink) 78%, transparent); font-weight: 600; }\n.mic {\n  flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center;\n  border: 0; border-radius: 50%; background: transparent; color: var(--pill-ink);\n}\n.mic:hover { background: rgba(255, 255, 255, .08); }\n.mic.live { color: var(--danger); animation: pulse 1.1s infinite; }\n@keyframes pulse { 50% { opacity: .35; } }\n\n.suggest {\n  margin-top: -2px; background: var(--card); border: 1px solid var(--line);\n  border-radius: var(--r-sm); overflow: hidden; box-shadow: var(--shadow);\n}\n.suggest button {\n  display: flex; align-items: center; gap: 10px; width: 100%;\n  padding: 11px 14px; border: 0; background: transparent; text-align: left; font-size: 14px;\n}\n.suggest button:hover { background: var(--card-2); }\n.suggest .sug-type { color: var(--muted); font-size: 11px; margin-left: auto; }\n\n.homegrid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }\n\n.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }\n.addnew {\n  display: flex; flex-direction: column; align-items: flex-start; gap: 12px;\n  padding: var(--pad); text-align: left; color: var(--text); min-height: 128px;\n  transition: transform .16s ease, background .16s ease;\n}\n.addnew:hover { background: var(--card-2); transform: translateY(-1px); }\n.plus-tile {\n  width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center;\n  background: var(--card-3); color: var(--text);\n}\n.addnew-label { font-size: 15px; font-weight: 650; }\n\n.safety { padding: var(--pad); display: flex; flex-direction: column; gap: 16px; }\n.card-kicker { font-size: 14px; font-weight: 650; color: color-mix(in srgb, var(--text) 88%, var(--muted)); }\n.safety-row { display: flex; align-items: flex-start; gap: 16px; }\n.shield-tile {\n  flex: 0 0 auto; width: 56px; height: 56px; border-radius: 18px;\n  display: grid; place-items: center; background: var(--card-2);\n  color: var(--accent); border: 1px solid var(--line);\n}\n.shield-tile svg { width: 28px; height: 28px; }\n.safety-copy h3 { margin: 4px 0 4px; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; font-weight: 750; }\n.safety-copy p { margin: 0; color: var(--muted); font-size: 13.5px; font-weight: 550; }\n.safety.armed .shield-tile { background: color-mix(in srgb, var(--accent) 22%, var(--card-2)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }\n.accent-btn {\n  align-self: flex-end; border: 0; border-radius: 999px; padding: 13px 22px;\n  background: var(--accent); color: var(--accent-ink); font-size: 15.5px; font-weight: 700;\n  transition: filter .15s ease, transform .12s ease;\n}\n.accent-btn:hover { filter: brightness(1.06); }\n.accent-btn:active { transform: scale(.97); }\n\n.quicklinks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }\n.quicklink {\n  display: flex; flex-direction: column; align-items: center; gap: 8px;\n  padding: 12px 6px; border: 1px solid var(--line); border-radius: var(--r-sm);\n  background: color-mix(in srgb, var(--card) 78%, transparent); color: var(--text);\n  font-size: 12px; font-weight: 600; overflow: hidden;\n}\n.quicklink:hover { background: var(--card-2); }\n.quicklink .ql-badge {\n  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;\n  font-weight: 800; font-size: 15px;\n}\n.quicklink span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n.status-card { padding: 16px var(--pad); display: flex; flex-direction: column; gap: 14px; background: color-mix(in srgb, var(--card) 70%, transparent); }\n.status-item { display: flex; align-items: center; gap: 12px; }\n.status-item b { display: block; font-size: 13.5px; font-weight: 650; }\n.status-item small { color: var(--muted); font-size: 12px; }\n.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted-2); flex: 0 0 auto; box-shadow: 0 0 0 4px color-mix(in srgb, var(--muted-2) 18%, transparent); }\n.dot.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }\n.dot.warn { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }\n\n.recent { display: flex; flex-direction: column; gap: 10px; }\n.recent-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }\n.recent-head h3 { margin: 0; font-size: 14px; font-weight: 650; color: var(--muted); letter-spacing: .01em; }\n.recent-head button { border: 0; background: transparent; color: var(--accent); font-size: 12.5px; font-weight: 650; }\n.recent-item {\n  display: flex; align-items: center; gap: 12px; padding: 10px 14px;\n  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm);\n  text-align: left; color: var(--text);\n}\n.recent-item:hover { background: var(--card-2); }\n.recent-item .r-badge { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--card-3); color: var(--text); flex: 0 0 auto; }\n.recent-item .r-body { min-width: 0; }\n.recent-item b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.recent-item small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }\n\n/* ---------- page view ---------- */\n.page { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }\n.addressbar {\n  display: flex; align-items: center; gap: 6px; margin: 4px var(--pad) 10px;\n  padding: 6px 6px 6px 10px; background: var(--card); border: 1px solid var(--line);\n  border-radius: 999px;\n}\n.addressbar input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14px; font-weight: 550; }\n.lock { display: grid; place-items: center; color: var(--ok); }\n.lock svg { width: 15px; height: 15px; }\n.lock.insecure { color: var(--muted-2); }\n.addr-btn { border: 0; background: transparent; color: var(--text); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }\n.addr-btn:hover { background: var(--card-2); }\n\n.frame-wrap { position:
