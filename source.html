<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15161a">
  <title>Titanium — source</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>/* ============================================================
   Titanium — design system
   Mobile-first. The screenshot look: near-black canvas, soft
   charcoal cards, a blue-grey search pill and one accent hue.
   ============================================================ */

:root {
  --bg: #15161a;
  --bg-deep: #0e0f12;
  --card: #23252a;
  --card-2: #2a2d33;
  --card-3: #33363d;
  --line: rgba(255, 255, 255, .08);
  --line-strong: rgba(255, 255, 255, .14);
  --text: #f1f4f9;
  --muted: #99a2b0;
  --muted-2: #6f7887;
  --accent: #8ab4f8;
  --accent-ink: #0c1421;
  --pill: #2f3b52;
  --pill-ink: #eaf1ff;
  --danger: #ff7b7b;
  --ok: #74d6a3;
  --r: 22px;
  --r-sm: 14px;
  --r-xs: 10px;
  --pad: 20px;
  --gap: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --sheet-max: 560px;
  --shell-max: 520px;
  color-scheme: dark;
}

html[data-theme="slate"] {
  --bg: #1b2029;
  --bg-deep: #12161d;
  --card: #262c37;
  --card-2: #2e3542;
  --card-3: #38404f;
  --pill: #35455f;
}
html[data-theme="oled"] {
  --bg: #000;
  --bg-deep: #000;
  --card: #0d0d0f;
  --card-2: #141417;
  --card-3: #1b1b1f;
  --line: rgba(255, 255, 255, .1);
  --pill: #101318;
}
html[data-theme="day"] {
  color-scheme: light;
  --bg: #f5f7fb;
  --bg-deep: #e9edf5;
  --card: #fff;
  --card-2: #f1f4fa;
  --card-3: #e6ebf4;
  --line: rgba(16, 24, 40, .09);
  --line-strong: rgba(16, 24, 40, .16);
  --text: #121821;
  --muted: #5c6779;
  --muted-2: #8b95a5;
  --pill: #e4ecfb;
  --pill-ink: #17233a;
  --accent-ink: #fff;
  --shadow: 0 18px 50px rgba(21, 33, 61, .14);
}
html[data-theme="sepia"] {
  color-scheme: light;
  --bg: #f6efe4;
  --bg-deep: #ece1d1;
  --card: #fffaf1;
  --card-2: #f4ebdc;
  --card-3: #e9dcc8;
  --line: rgba(80, 55, 25, .12);
  --line-strong: rgba(80, 55, 25, .2);
  --text: #241a0e;
  --muted: #6e5c45;
  --muted-2: #96826a;
  --pill: #eadfcd;
  --pill-ink: #2a1e10;
  --accent-ink: #fff;
  --shadow: 0 18px 50px rgba(84, 58, 24, .16);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* the hidden attribute must always win over component display rules */
[hidden] { display: none !important; }

html, body { margin: 0; min-height: 100%; }

body {
  background:
    radial-gradient(1100px 600px at 80% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(900px 500px at 0% 100%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 55%),
    var(--bg-deep);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- boot ---------- */
.boot {
  position: fixed; inset: 0; z-index: 90; display: grid; align-content: center; justify-items: center; gap: 8px;
  background: var(--bg-deep); transition: opacity .35s ease, visibility .35s;
}
.boot[hidden] { display: none; }
.boot.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.boot-icon { width: 84px; height: 84px; border-radius: 22px; box-shadow: var(--shadow); }
.boot-name { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin-top: 8px; }
.boot-sub { color: var(--muted); font-size: 13px; }

/* ---------- app shell ---------- */
.app {
  max-width: var(--shell-max);
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 88%, var(--accent) 4%), var(--bg) 240px);
  position: relative;
}
@media (min-width: 700px) {
  .app {
    min-height: calc(100dvh - 48px);
    margin: 24px auto;
    border: 1px solid var(--line);
    border-radius: 30px;
    overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 8px rgba(255, 255, 255, .02);
  }
}
html[data-device="pc"] .app { max-width: 1180px; min-height: 100dvh; margin: 0 auto; border-radius: 0; border: 0; box-shadow: none; }
html[data-device="pc"] .home { padding: 26px clamp(20px, 4vw, 52px) 40px; }
html[data-device="pc"] .homegrid { grid-template-columns: 1.05fr .95fr; align-items: stretch; }
html[data-device="pc"] .safety-row { gap: 18px; }
html[data-device="pc"] .quicklinks { grid-template-columns: repeat(6, minmax(0, 1fr)); }
html[data-device="pc"] .status-card { flex-direction: row; gap: 30px; justify-content: space-between; }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 6px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid transparent;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.icon-btn {
  flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: var(--text);
}
.icon-btn:hover { background: var(--card-2); }
.icon-btn:active { transform: scale(.94); }
.tabstrip {
  flex: 1 1 auto; display: flex; align-items: center; gap: 8px;
  overflow-x: auto; scrollbar-width: none; padding: 2px;
}
.tabstrip::-webkit-scrollbar { display: none; }
.tab-tile {
  flex: 0 0 auto; min-width: 40px; height: 40px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; border-radius: 12px;
  background: var(--card-2); color: var(--text);
  font-weight: 700; font-size: 14px; letter-spacing: -.01em;
}
.tab-tile.active { background: var(--card-3); box-shadow: inset 0 0 0 1px var(--line-strong); }
.tab-tile .tile-badge { width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; color: #0b1220; background: var(--accent); }
.tab-tile.home { background: transparent; }
.count-chip {
  flex: 0 0 auto; min-width: 34px; height: 30px; padding: 0 8px;
  border-radius: 10px; border: 1.5px solid var(--line-strong); background: transparent;
  color: var(--text); font-weight: 700; font-size: 13px;
}
.count-chip:hover { background: var(--card-2); }

/* ---------- home ---------- */
.stage { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.home { padding: 6px var(--pad) 40px; display: flex; flex-direction: column; gap: var(--gap); }
.home-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 2px; }
.hello { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .01em; }
.plan-pill {
  border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
  border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700;
}
.plan-pill.ult { border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); }

.searchpill {
  display: flex; align-items: center; gap: 12px;
  min-height: 60px; padding: 8px 10px 8px 12px;
  background: var(--pill); border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .22);
}
.searchpill:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.engine-badge {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: 15px;
  color: #fff; background: #333;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
}
.searchpill input {
  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: var(--pill-ink);
  font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; outline: none;
}
.searchpill input::placeholder { color: color-mix(in srgb, var(--pill-ink) 78%, transparent); font-weight: 600; }
.mic {
  flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--pill-ink);
}
.mic:hover { background: rgba(255, 255, 255, .08); }
.mic.live { color: var(--danger); animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.suggest {
  margin-top: -2px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-sm); overflow: hidden; box-shadow: var(--shadow);
}
.suggest button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 14px; border: 0; background: transparent; text-align: left; font-size: 14px;
}
.suggest button:hover { background: var(--card-2); }
.suggest .sug-type { color: var(--muted); font-size: 11px; margin-left: auto; }

.homegrid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.addnew {
  display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
  padding: var(--pad); text-align: left; color: var(--text); min-height: 128px;
  transition: transform .16s ease, background .16s ease;
}
.addnew:hover { background: var(--card-2); transform: translateY(-1px); }
.plus-tile {
  width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center;
  background: var(--card-3); color: var(--text);
}
.addnew-label { font-size: 15px; font-weight: 650; }

.safety { padding: var(--pad); display: flex; flex-direction: column; gap: 16px; }
.card-kicker { font-size: 14px; font-weight: 650; color: color-mix(in srgb, var(--text) 88%, var(--muted)); }
.safety-row { display: flex; align-items: flex-start; gap: 16px; }
.shield-tile {
  flex: 0 0 auto; width: 56px; height: 56px; border-radius: 18px;
  display: grid; place-items: center; background: var(--card-2);
  color: var(--accent); border: 1px solid var(--line);
}
.shield-tile svg { width: 28px; height: 28px; }
.safety-copy h3 { margin: 4px 0 4px; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; font-weight: 750; }
.safety-copy p { margin: 0; color: var(--muted); font-size: 13.5px; font-weight: 550; }
.safety.armed .shield-tile { background: color-mix(in srgb, var(--accent) 22%, var(--card-2)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.accent-btn {
  align-self: flex-end; border: 0; border-radius: 999px; padding: 13px 22px;
  background: var(--accent); color: var(--accent-ink); font-size: 15.5px; font-weight: 700;
  transition: filter .15s ease, transform .12s ease;
}
.accent-btn:hover { filter: brightness(1.06); }
.accent-btn:active { transform: scale(.97); }

.quicklinks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.quicklink {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 12px 6px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--card) 78%, transparent); color: var(--text);
  font-size: 12px; font-weight: 600; overflow: hidden;
}
.quicklink:hover { background: var(--card-2); }
.quicklink .ql-badge {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  font-weight: 800; font-size: 15px;
}
.quicklink span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.status-card { padding: 16px var(--pad); display: flex; flex-direction: column; gap: 14px; background: color-mix(in srgb, var(--card) 70%, transparent); }
.status-item { display: flex; align-items: center; gap: 12px; }
.status-item b { display: block; font-size: 13.5px; font-weight: 650; }
.status-item small { color: var(--muted); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted-2); flex: 0 0 auto; box-shadow: 0 0 0 4px color-mix(in srgb, var(--muted-2) 18%, transparent); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }
.dot.warn { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }

.recent { display: flex; flex-direction: column; gap: 10px; }
.recent-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
.recent-head h3 { margin: 0; font-size: 14px; font-weight: 650; color: var(--muted); letter-spacing: .01em; }
.recent-head button { border: 0; background: transparent; color: var(--accent); font-size: 12.5px; font-weight: 650; }
.recent-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm);
  text-align: left; color: var(--text);
}
.recent-item:hover { background: var(--card-2); }
.recent-item .r-badge { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--card-3); color: var(--text); flex: 0 0 auto; }
.recent-item .r-body { min-width: 0; }
.recent-item b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-item small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* ---------- page view ---------- */
.page { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.addressbar {
  display: flex; align-items: center; gap: 6px; margin: 4px var(--pad) 10px;
  padding: 6px 6px 6px 10px; background: var(--card); border: 1px solid var(--line);
  border-radius: 999px;
}
.addressbar input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14px; font-weight: 550; }
.lock { display: grid; place-items: center; color: var(--ok); }
.lock svg { width: 15px; height: 15px; }
.lock.insecure { color: var(--muted-2); }
.addr-btn { border: 0; background: transparent; color: var(--text); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.addr-btn:hover { background: var(--card-2); }

.frame-wrap { position: relative; flex: 1 1 auto; min-height: 48vh; margin: 0 var(--pad) 16px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
.frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; min-height: 48vh; }
html[data-device="pc"] .frame-wrap { flex: 1 1 auto; min-height: 62vh; }
html[data-device="pc"] .frame-wrap iframe { min-height: 62vh; }
.frame-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--card); }
.ff-inner { max-width: 360px; text-align: center; }
.ff-icon { width: 58px; height: 58px; border-radius: 18px; display: inline-grid; place-items: center; background: var(--card-2); color: var(--accent); margin-bottom: 12px; }
.ff-icon svg { width: 28px; height: 28px; }
.ff-inner h3 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.02em; }
.ff-inner p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
.ff-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------- sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .5); backdrop-filter: blur(3px); }
.sheet-shell {
  position: relative; z-index: 1; width: 100%; max-width: var(--sheet-max);
  background: var(--bg); border: 1px solid var(--line); border-radius: 26px 26px 0 0;
  align-self: flex-end; max-height: 94dvh; display: flex; flex-direction: column;
  box-shadow: var(--shadow); animation: sheetIn .26s cubic-bezier(.22, 1, .36, 1);
}
@media (min-width: 700px) {
  .sheet-shell { align-self: center; border-radius: 26px; max-height: 88dvh; }
}
@keyframes sheetIn { from { transform: translateY(18px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 6px; padding: 12px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1 1 auto; margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.015em; }
.sheet-body { padding: 16px var(--pad) calc(28px + env(safe-area-inset-bottom)); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-body > * { flex: 0 0 auto; }

.section-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); margin: 10px 2px 0; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.list-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; width: 100%;
  padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; color: var(--text);
}
.list-row:last-child { border-bottom: 0; }
button.list-row:hover { background: var(--card-2); }
.list-row .lr-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card-2); color: var(--accent); flex: 0 0 auto; }
.list-row .lr-icon svg { width: 18px; height: 18px; }
.list-row .lr-body { flex: 1 1 auto; min-width: 0; }
.list-row b { display: block; font-size: 14px; font-weight: 600; }
.list-row small { display: block; color: var(--muted); font-size: 12px; }
.list-row .chev { color: var(--muted-2); font-size: 18px; }
.list-row .chips { padding: 0; justify-content: flex-end; }
.list-row .chip { padding: 5px 10px; font-size: 12px; }

.toggle { position: relative; flex: 0 0 auto; width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--card-3); transition: background .18s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.toggle[aria-pressed="true"] { background: var(--accent); }
.toggle[aria-pressed="true"]::after { transform: translateX(18px); background: var(--accent-ink); }
html[data-theme="day"] .toggle[aria-pressed="true"]::after, html[data-theme="sepia"] .toggle[aria-pressed="true"]::after { background: #fff; }

.field { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; }
.field label { font-size: 12px; font-weight: 650; color: var(--muted); }
.field input[type="text"], .field input[type="email"], .field select, .field textarea {
  width: 100%; padding: 10px 12px; border-radius: var(--r-xs);
  border: 1px solid var(--line-strong); background: var(--card-2); outline: none; font-size: 14px;
}
.field textarea { resize: vertical; min-height: 84px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field .hint { font-size: 11.5px; color: var(--muted-2); }
.range-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.range-row input[type="range"] { flex: 1 1 auto; accent-color: var(--accent); }
.range-row output { min-width: 46px; text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
.chip {
  border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
  border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.lock::after { content: " ★"; font-size: 10px; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 14px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; position: relative; }
.swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg) inset; }
.swatch.lock { opacity: .55; }

.plan-grid { display: grid; gap: 12px; }
.plan {
  border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
  background: var(--card); display: flex; flex-direction: column; gap: 10px;
}
.plan.current { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--card)); }
.plan .plan-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.plan h3 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
.plan .price { font-size: 13px; font-weight: 700; color: var(--accent); }
.plan ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }

rn '\u003cspan class=\"brand-fallback\">' + String(key || '?').slice(0, 2).toUpperCase() + '\u003c/span>';\n}\n\nfunction brandMarkForUrl(url, size = 20, fallbackText = '') {\n  const brand = brandForUrl(url);\n  if (brand) return brandImg(brand, size);\n  const letter = (fallbackText || hostOf(url) || '?').charAt(0).toUpperCase();\n  return '\u003cspan class=\"brand-fallback\">' + esc(letter) + '\u003c/span>';\n}\n","src/app.js":"'use strict';\n/* ============================================================\n   Titanium — core: state, theme, tabs, navigation, home screen\n   ============================================================ */\n\nconst $ = (sel, root = document) => root.querySelector(sel);\nconst $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));\nconst esc = (v) => String(v ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst clamp = (n, a, b) => Math.min(b, Math.max(a, n));\nconst uid = () => Math.random().toString(36).slice(2, 9);\nconst LS_KEY = 'titanium.state.v1';\nconst VERSION = '1.0.0';\n\nconst RANK = { free: 0, premium: 1, ultimate: 2 };\nconst PLANS = {\n  free: { name: 'Free', price: '$0', per: 'forever', blurb: 'Everything you need to browse privately.' },\n  premium: { name: 'Premium', price: '$4.99', per: 'month', blurb: 'Strict blocking, real VPN servers, sync.' },\n  ultimate: { name: 'Ultimate', price: '$9.99', per: 'month', blurb: 'No limits, custom filters, multi-device delegation.' }\n};\nconst LIMITS = {\n  extensions: { free: 2, premium: 10, ultimate: Infinity },\n  vpnServers: { free: 3, premium: 12, ultimate: 16 },\n  retention: { free: 7, premium: 90, ultimate: 365 }\n};\nconst can = (need) => RANK[S.plan] >= RANK[need];\n\nconst ENGINES = [\n  { id: 'duckduckgo', name: 'DuckDuckGo', letter: 'D', color: '#de5833', search: 'https://duckduckgo.com/?q=%s', note: 'No tracking, no search profile' },\n  { id: 'google', name: 'Google', letter: 'G', color: '#4285f4', search: 'https://www.google.com/search?q=%s', note: 'Best coverage, most data collection' },\n  { id: 'brave', name: 'Brave Search', letter: 'B', color: '#fb542b', search: 'https://search.brave.com/search?q=%s', note: 'Independent index, private by default' },\n  { id: 'ecosia', name: 'Ecosia', letter: 'E', color: '#1f8a4c', search: 'https://www.ecosia.org/search?q=%s', note: 'Plants trees with its ad revenue' },\n  { id: 'bing', name: 'Bing', letter: 'B', color: '#00897b', search: 'https://www.bing.com/search?q=%s', note: 'Microsoft index' },\n  { id: 'yahoo', name: 'Yahoo', letter: 'Y', color: '#6001d2', search: 'https://search.yahoo.com/search?p=%s', note: 'Powered by Bing' },\n  { id: 'startpage', name: 'Startpage', letter: 'S', color: '#4b6bfb', search: 'https://www.startpage.com/sp/search?query=%s', note: 'Google results, zero tracking' },\n  { id: 'qwant', name: 'Qwant', letter: 'Q', color: '#5c97ff', search: 'https://www.qwant.com/?q=%s', note: 'European privacy index' },\n  { id: 'mojeek', name: 'Mojeek', letter: 'M', color: '#ef7d1a', search: 'https://www.mojeek.com/search?q=%s', note: 'Own crawler, no profiling' },\n  { id: 'swisscows', name: 'Swisscows', letter: 'S', color: '#0a86b8', search: 'https://swisscows.com/en/web?query=%s', note: 'Swiss-hosted, family safe' },\n  { id: 'presearch', name: 'Presearch', letter: 'P', color: '#1f7dff', search: 'https://presearch.com/search?q=%s', note: 'Community-run and decentralized' },\n  { id: 'searx', name: 'SearXNG', letter: 'X', color: '#5a7d8c', search: 'https://searx.be/search?q=%s', note: 'Open-source metasearch' },\n  { id: 'yandex', name: 'Yandex', letter: 'Y', color: '#fc3f1d', search: 'https://yandex.com/search/?text=%s', note: 'Strong for regional results' },\n  { id: 'kagi', name: 'Kagi', letter: 'K', color: '#ffb319', search: 'https://kagi.com/search?q=%s', note: 'Paid, ad-free, no ranking games' },\n  { id: 'baidu', name: 'Baidu', letter: 'B', color: '#2932e1', search: 'https://www.baidu.com/s?wd=%s', note: 'Chinese-language index' }\n];\n\nconst BRAND_ALIAS = { searx: 'searxng' };\nENGINES.forEach((e) => { e.brand = BRAND_ALIAS[e.id] || e.id; });\n\nconst ACCENTS = [\n  { id: 'blue', name: 'Titanium blue', color: '#8ab4f8', need: 'free' },\n  { id: 'violet', name: 'Violet', color: '#b9a6ff', need: 'premium' },\n  { id: 'mint', name: 'Mint', color: '#7ee0c0', need: 'premium' },\n  { id: 'amber', name: 'Amber', color: '#f5c26b', need: 'premium' },\n  { id: 'rose', name: 'Rose', color: '#f6a5b8', need: 'premium' },\n  { id: 'lime', name: 'Lime', color: '#b6e36a', need: 'premium' },\n  { id: 'ice', name: 'Ice', color: '#cfd8e3', need: 'premium' }\n];\n\nconst THEMES = [\n  { id: 'midnight', name: 'Midnight', need: 'free' },\n  { id: 'slate', name: 'Slate', need: 'premium' },\n  { id: 'oled', name: 'OLED black', need: 'premium' },\n  { id: 'day', name: 'Daylight', need: 'premium' },\n  { id: 'sepia', name: 'Sepia', need: 'premium' }\n];\n\nconst DEFAULT_STATE = {\n  onboarded: false,\n  heardFrom: '',\n  device: 'mobile',\n  plan: 'free',\n  engine: 'duckduckgo',\n  customEngine: { name: '', url: '' },\n  account: null,\n  theme: { preset: 'minimal', mode: 'midnight', accent: '#8ab4f8', accentId: 'blue', radius: 14, density: 'cozy', font: 15, wallpaper: false, tabLabels: true, iconStyle: 'color', searchShape: 'pill', animations: true },\n  home: { shortcuts: true, safety: true, quicklinks: true, recent: true, suggestions: true, engines: true, greeting: true, status: true },\n  privacy: { adblock: 'balanced', safeBrowsing: true, dnt: true, httpsOnly: true, cookies: true, filters: '' },\n  vpn: { on: false, server: 'auto', protocol: 'wireguard', killSwitch: false, split: false },\n  history: { on: true, retention: 7, incognito: false, items: [] },\n  delegation: { active: null, pending: { label: '', scope: { titles: true, urls: true, downloads: false }, days: 30 }, log: [] },\n  shortcuts: [\n    { name: 'Wikipedia', url: 'https://wikipedia.org' },\n    { name: 'YouTube', url: 'https://youtube.com' },\n    { name: 'GitHub', url: 'https://github.com' },\n    { name: 'Reddit', url: 'https://reddit.com' },\n    { name: 'Hacker News', url: 'https://news.ycombinator.com' },\n    { name: 'MDN', url: 'https://developer.mozilla.org' },\n    { name: 'Maps', url: 'https://maps.google.com' },\n    { name: 'X', url: 'https://x.com' }\n  ]\n};\n\nlet S = loadState();\nlet tabs = [{ id: 't1', url: null, title: 'New tab', stack: [], idx: -1 }];\nlet activeId = 't1';\nlet sheetStack = [];\nlet frameTimer = null;\n\nfunction deepMerge(base, patch) {\n  if (Array.isArray(base)) return Array.isArray(patch) ? patch : base;\n  if (base && typeof base === 'object') {\n    const out = { ...base };\n    for (const k of Object.keys(base)) if (patch && k in patch) out[k] = deepMerge(base[k], patch[k]);\n    for (const k of Object.keys(patch || {})) if (!(k in base)) out[k] = patch[k];\n    return out;\n  }\n  return patch === undefined ? base : patch;\n}\n\nfunction loadState() {\n  try {\n    const raw = localStorage.getItem(LS_KEY);\n    if (!raw) return structuredClone(DEFAULT_STATE);\n    const parsed = JSON.parse(raw);\n    const merged = deepMerge(structuredClone(DEFAULT_STATE), parsed);\n    merged.history.retention = clamp(Number(merged.history.retention) || 7, 1, LIMITS.retention[merged.plan] || 7);\n    return merged;\n  } catch {\n    return structuredClone(DEFAULT_STATE);\n  }\n}\n\nfunction save() {\n  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch { /* storage full / blocked */ }\n}\n\nfunction getPath(path) {\n  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), S);\n}\nfunction setPath(path, value) {\n  const keys = path.split('.');\n  const last = keys.pop();\n  const target = keys.reduce((o, k) => o[k], S);\n  target[last] = value;\n}\nfunction engine() {\n  const custom = S.customEngine;\n  if (custom && custom.name && custom.url) return { id: 'custom', name: custom.name, brand: null, letter: custom.name[0].toUpperCase(), color: '#8b93a1', search: custom.url };\n  return ENGINES.find((e) => e.id === S.engine) || ENGINES[0];\n}\nfunction deviceName() {\n  return S.device === 'pc' ? 'Desktop' : 'Mobile';\n}\nfunction greet() {\n  const h = new Date().getHours();\n  const part = h \u003c 5 ? 'Still up' : h \u003c 12 ? 'Good morning' : h \u003c 18 ? 'Good afternoon' : 'Good evening';\n  const first = S.account?.name ? S.account.name.split(' ')[0] : '';\n  return first ? `${part}, ${first}` : part;\n}\nfunction hostOf(url) {\n  try { return new URL(url).hostname.replace(/^www\\./, ''); } catch { return url; }\n}\nfunction hueFor(text) {\n  let h = 0;\n  for (let i = 0; i \u003c text.length; i++) h = (h * 31 + text.charCodeAt(i)) % 360;\n  return h;\n}\nfunction badgeFor(url) {\n  const host = hostOf(url);\n  return { letter: (host[0] || '?').toUpperCase(), color: `hsl(${hueFor(host)} 48% 42%)` };\n}\nfunction timeAgo(ts) {\n  const d = Math.max(1, Math.round((Date.now() - ts) / 60000));\n  if (d \u003c 60) return `${d} min ago`;\n  const h = Math.round(d / 60);\n  if (h \u003c 24) return `${h} h ago`;\n  return `${Math.round(h / 24)} d ago`;\n}\n\n/* ---------- theme + device ---------- */\nfunction applySettings() {\n  const t = S.theme;\n  const html = document.documentElement;\n  html.dataset.theme = t.mode;\n  html.dataset.device = S.device;\n  html.dataset.density = t.density;\n  html.dataset.icons = t.iconStyle || 'color';\n  html.dataset.shape = t.searchShape || 'pill';\n  html.classList.toggle('no-anim', t.animations === false);\n  html.style.setProperty('--accent', t.accent);\n  html.style.setProperty('--r', `${t.radius}px`);\n  html.style.setProperty('--font-size', `${t.font}px`);\n  html.style.fontSize = `${t.font}px`;\n  document.body.style.fontSize = `${t.font}px`;\n  document.body.style.background = t.wallpaper\n    ? undefined\n    : 'var(--bg-deep)';\n  $('.home')?.classList.toggle('no-glow', !t.wallpaper);\n  const meta = document.querySelector('meta[name=\"theme-color\"]');\n  if (meta) meta.content = getComputedStyle(html).getPropertyValue('--bg').trim() || '#15161a';\n  if (S.privacy.adblock === 'off') S.privacy.safeBrowsing = S.privacy.safeBrowsing; // no-op, keeps shape\n}\n\n/* ---------- tabs ---------- */\nfunction activeTab() {\n  return tabs.find((t) => t.id === activeId) || tabs[0];\n}\n\nfunction renderTopbar() {\n  const strip = $('#tabstrip');\n  if (!strip) return;\n  const showLabels = S.theme.tabLabels !== false;\n  strip.innerHTML = tabs.map((t) => {\n    const label = t.url ? hostOf(t.url) : 'New tab';\n    const mark = t.url ? brandMarkForUrl(t.url, 18, label) : '\u003cimg class=\"brand-img\" src=\"icon.svg\" width=\"18\" height=\"18\" alt=\"\">';\n    return `\u003cbutton class=\"tab-tile ${t.id === activeId ? 'active' : ''}\" data-tab=\"${t.id}\" role=\"tab\" aria-selected=\"${t.id === activeId}\" title=\"${esc(label)}\">\n      ${mark}\n      ${showLabels ? `\u003cspan class=\"tab-label\">${esc(label.length > 14 ? label.slice(0, 13) + '…' : label)}\u003c/span>` : ''}\n    \u003c/button>`;\n  }).join('');\n  $('#tabCountBtn').textContent = String(tabs.length);\n  $$('#tabstrip .tab-tile').forEach((btn) => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));\n}\n\nfunction switchTab(id) {\n  activeId = id;\n  renderTopbar();\n  renderView();\n}\n\nfunction newTab(url = null) {\n  const cap = S.plan === 'free' ? 5 : S.plan === 'premium' ? 20 : Infinity;\n  if (tabs.length >= cap) {\n    toast(`Your plan allows ${cap} tabs at once`);\n    openSheet('plans');\n    return;\n  }\n  const id = 't' + uid();\n  tabs.push({ id, url: null, title: 'New tab', stack: [], idx: -1 });\n  activeId = id;\n  renderTopbar();\n  if (url) navigate(url);\n  else renderView();\n  $('#searchInput')?.focus();\n}\n\nfunction closeTab(id) {\n  if (tabs.length === 1) {\n    const t = tabs[0];\n    t.url = null; t.stack = []; t.idx = -1;\n    renderTopbar(); renderView();\n    return;\n  }\n  const i = tabs.findIndex((t) => t.id === id);\n  tabs = tabs.filter((t) => t.id !== id);\n  if (activeId === id) activeId = tabs[Math.max(0, i - 1)].id;\n  renderTopbar(); renderView();\n}\n\nfunction goHome() {\n  const t = activeTab();\n  t.url = null;\n  renderTopbar(); renderView();\n}\n\n/* ---------- navigation ---------- */\nfunction toURL(input) {\n  const q = String(input || '').trim();\n  if (!q) return null;\n  if (/^(https?|file):\\/\\//i.test(q)) return q;\n  if (/^(about|chrome|titanium):/i.test(q)) return q;\n  if (/^localhost(:\\d+)?(\\/|$)/i.test(q)) return 'http://' + q;\n  if (/^[\\w-]+(\\.[\\w-]+)+(\\/\\S*)?$/.test(q) && !/\\s/.test(q)) return 'https://' + q;\n  if (/^\\d{1,3}(\\.\\d{1,3}){3}(:\\d+)?(\\/|$)/.test(q)) return 'http://' + q;\n  return engine().search.replace('%s', encodeURIComponent(q));\n}\n\nfunction navigate(input, opts = {}) {\n  const url = toURL(input);\n  if (!url) return;\n  const t = activeTab();\n  if (!opts.replace) {\n    t.stack = t.stack.slice(0, t.idx + 1);\n    t.stack.push(url);\n    t.idx = t.stack.length - 1;\n  } else {\n    t.stack[t.idx] = url;\n  }\n  t.url = url;\n  recordHistory(url);\n  $('#suggest').hidden = true;\n  renderTopbar();\n  renderView();\n}\n\nfunction back() {\n  const t = activeTab();\n  if (t.idx > 0) {\n    t.idx -= 1;\n    t.url = t.stack[t.idx];\n    renderView();\n  } else {\n    goHome();\n  }\n}\n\nfunction recordHistory(url) {\n  if (!S.history.on) return;\n  if (S.history.incognito) return;\n  if (/^titanium:/i.test(url)) return;\n  const entry = { id: uid(), url, title: hostOf(url), ts: Date.now() };\n  S.history.items = [entry, ...S.history.items.filter((h) => h.url !== url)].slice(0, 600);\n  pruneHistory();\n  save();\n  renderHome();\n}\n\nfunction pruneHistory() {\n  const days = LIMITS.retention[S.plan] || 7;\n  if (S.history.retention > days) S.history.retention = days;\n  const cutoff = Date.now() - S.history.retention * 86400000;\n  S.history.items = S.history.items.filter((h) => h.ts >= cutoff);\n}\n\n/* ---------- views ---------- */\nfunction renderView() {\n  const t = activeTab();\n  const homeView = $('#homeView');\n  const pageView = $('#pageView');\n  if (!homeView || !pageView) return;\n  const isHome = !t.url;\n  homeView.hidden = !isHome;\n  pageView.hidden = isHome;\n  if (isHome) {\n    renderHome();\n    return;\n  }\n  $('#addressInput').value = t.url;\n  const lock = $('#lockIcon');\n  lock.classList.toggle('insecure', !/^https:/i.test(t.url));\n  loadFrame(t.url);\n}\n\nfunction loadFrame(url) {\n  const frame = $('#frame');\n  const fallback = $('#frameFallback');\n  fallback.hidden = true;\n  clearTimeout(frameTimer);\n  if (!/^https?:/i.test(url)) {\n    $('#ffSite').textContent = 'Titanium only loads http and https pages in the tab frame.';\n    fallback.hidden = false;\n    return;\n  }\n  frame.src = url;\n  frameTimer = setTimeout(() => {\n    let blocked = false;\n    try {\n      const doc = frame.contentDocument;\n      if (doc && (doc.location.href === 'about:blank' || !doc.body || doc.body.childElementCount === 0)) blocked = true;\n    } catch { blocked = false; }\n    if (blocked) {\n      $('#ffSite').textContent = `${hostOf(url)} refused to be embedded (X-Frame-Options or a frame-ancestors CSP). A single-file browser can't strip that header — open it in your installed browser instead.`;\n      fallback.hidden = false;\n    }\n  }, 3200);\n}\n\n/* ---------- home ---------- */\nfunction renderHome() {\n  if (!$('#homeView')) return;\n  $('#hello').textContent = greet();\n  $('#hello').hidden = S.home.greeting === false;\n  const pill = $('#planPill');\n  pill.textContent = PLANS[S.plan].name;\n  pill.classList.toggle('ult', S.plan === 'ultimate');\n\n  const eng = engine();\n  const badge = $('#engineBadge');\n  badge.innerHTML = eng.brand ? brandMark(eng.brand, 26) : `\u003cspan class=\"brand-fallback\">${esc(eng.letter || 'S')}\u003c/span>`;\n  $('#searchInput').placeholder = `Search ${eng.name} or type URL`;\n\n  const safety = $('#safetyCard');\n  safety.classList.toggle('armed', S.privacy.safeBrowsing);\n  if (S.privacy.safeBrowsing) {\n    $('#safetyTitle').textContent = 'Safe Browsing is on';\n    $('#safetyText').textContent = 'Dangerous sites and downloads are flagged';\n    $('#safetyBtn').textContent = 'Review protections';\n  } else {\n    $('#safetyTitle').textContent = 'Turn on Safe Browsing';\n    $('#safetyText').textContent = 'Get protection against dangerous sites';\n    $('#safetyBtn').textContent = 'Go to settings';\n  }\n\n  $('#quicklinks').innerHTML = (S.shortcuts || []).slice(0, can('premium') ? 12 : 8).map((s, i) => {\n    return `\u003cbutton class=\"quicklink\" data-shortcut=\"${i}\" title=\"${esc(s.url)}\">\n      \u003cspan class=\"ql-badge\">${brandMarkForUrl(s.url, 26, s.name)}\u003c/span>\n      \u003cspan>${esc(s.name)}\u003c/span>\n    \u003c/button>`;\n  }).join('');\n  $$('#quicklinks .quicklink').forEach((b) => b.addEventListener('click', () => navigate(S.shortcuts[Number(b.dataset.shortcut)].url)));\n\n  $('#vpnStatus').textContent = S.vpn.on ? `VPN on · ${serverName(S.vpn.server)}` : 'VPN off';\n  $('#vpnSub').textContent = S.vpn.on ? `${S.vpn.protocol} tunnel active` : 'No tunnel active';\n  $('#dotVpn').className = 'dot' + (S.vpn.on ? ' on' : '');\n\n  const adLabels = { off: 'Ad block off', balanced: 'Ad block on', strict: 'Strict blocking', aggressive: 'Ultimate blocking' };\n  $('#blockStatus').textContent = adLabels[S.privacy.adblock] || 'Ad block on';\n  $('#blockSub').textContent = S.privacy.adblock === 'off' ? 'Nothing is filtered' : 'Trackers, ads and annoyances filtered';\n  $('#dotBlock').className = 'dot' + (S.privacy.adblock === 'off' ? '' : ' on');\n\n  $('#histStatus').textContent = S.history.incognito ? 'Private mode' : S.history.on ? 'History on' : 'History off';\n  $('#histSub').textContent = S.history.on && !S.history.incognito ? `Kept ${S.history.retention} days` : S.history.incognito ? 'New tabs start private' : 'Nothing is recorded';\n  $('#dotHist').className = 'dot' + (S.history.on && !S.history.incognito ? ' on' : ' warn');\n\n  const recent = S.history.items.slice(0, 4);\n  const recentWrap = $('#recent');\n  recentWrap.hidden = !S.home.recent || recent.length === 0;\n  recentWrap.innerHTML = recent.length ? `\n    \u003cdiv class=\"recent-head\">\u003ch3>Jump back in\u003c/h3>\u003cbutton data-act=\"history\">History\u003c/button>\u003c/div>\n          ${recent.map((h) => `\u003cbutton class=\"recent-item\" data-url=\"${esc(h.url)}\">\n      \u003cspan class=\"r-badge\">${brandMarkForUrl(h.url, 20, h.title)}\u003c/span>\n      \u003cspan class=\"r-body\">\u003cb>${esc(h.title)}\u003c/b>\u003csmall>${esc(h.url)} · ${timeAgo(h.ts)}\u003c/small>\u003c/span>\n    \u003c/button>`).join('')}` : '';\n  $$('#recent .recent-item').forEach((b) => b.addEventListener('click', () => navigate(b.dataset.url)));\n\n  if (!S.home.quicklinks) $('#quicklinks').hidden = true; else $('#quicklinks').hidden = false;\n  $('#safetyCard').hidden = !S.home.safety;\n  $('#addShortcutBtn').hidden = !S.home.shortcuts;\n  $('#statusCard').hidden = S.home.status === false;\n\n  const strip = $('#engineStrip');\n  if (strip) {\n    strip.hidden = S.home.engines === false;\n    strip.innerHTML = ENGINES.map((e) => `\u003cbutton class=\"engine-chip\" data-act=\"engine\" data-engine=\"${e.id}\"\n      title=\"${esc(e.name)}\" aria-label=\"Search with ${esc(e.name)}\"\n      aria-pressed=\"${S.engine === e.id && !S.customEngine.name}\">${brandMark(e.brand, 24)}\u003c/button>`).join('');\n  }\n}\n\n/* ---------- sheet router ---------- */\nfunction openSheet(name, params = {}) {\n  if (!name || name === sheetStack[sheetStack.length - 1]) {\n    renderSheet();\n    $('#sheet').hidden = false;\n    return;\n  }\n  sheetStack.push(name);\n  sheetParams = params;\n  $('#sheet').hidden = false;\n  renderSheet();\n}\nlet sheetParams = {};\n\nfunction navigateSheet(name, params = {}) {\n  sheetStack.push(name);\n  sheetParams = params;\n  renderSheet(true);\n}\n\nfunction sheetBack() {\n  if (sheetStack.length > 1) sheetStack.pop();\n  renderSheet(true);\n}\n\nfunction closeSheet() {\n  $('#sheet').hidden = true;\n  sheetStack = [];\n  sheetParams = {};\n}\n\nfunction renderSheet(keepScroll = false) {\n  const body = $('#sheetBody');\n  const scroll = keepScroll ? body.scrollTop : 0;\n  if (!sheetStack.length) sheetStack = ['root'];\n  const name = sheetStack[sheetStack.length - 1];\n  const panel = PANELS[name] || PANELS.root;\n  const out = panel(sheetParams);\n  $('#sheetTitle').textContent = out.title;\n  body.innerHTML = out.html;\n  $('#sheetBack').style.visibility = sheetStack.length > 1 ? 'visible' : 'hidden';\n  body.scrollTop = scroll;\n  if (out.bind) out.bind(body);\n}\n\n/* ---------- toast + modal ---------- */\nlet toastTimer = null;\nfunction toast(msg) {\n  const t = $('#toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);\n}\n\nfunction openModal(html, onMount) {\n  $('#modal').hidden = false;\n  $('#modalCard').innerHTML = html;\n  if (onMount) onMount($('#modalCard'));\n}\nfunction closeModal() {\n  $('#modal').hidden = true;\n  $('#modalCard').innerHTML = '';\n}\n\n/* ---------- adblock + vpn helpers ---------- */\nconst SERVERS = [\n  { id: 'auto', name: 'Auto (fastest)', need: 'free', flag: '⚡' },\n  { id: 'us', name: 'United States', need: 'free', flag: '🇺🇸' },\n  { id: 'nl', name: 'Netherlands', need: 'free', flag: '🇳🇱' },\n  { id: 'de', name: 'Germany', need: 'premium', flag: '🇩🇪' },\n  { id: 'uk', name: 'United Kingdom', need: 'premium', flag: '🇬🇧' },\n  { id: 'ca', name: 'Canada', need: 'premium', flag: '🇨🇦' },\n  { id: 'fr', name: 'France', need: 'premium', flag: '🇫🇷' },\n  { id: 'se', name: 'Sweden', need: 'premium', flag: '🇸🇪' },\n  { id: 'ch', name: 'Switzerland', need: 'premium', flag: '🇨🇭' },\n  { id: 'jp', name: 'Japan', need: 'premium', flag: '🇯🇵' },\n  { id: 'sg', name: 'Singapore', need: 'premium', flag: '🇸🇬' },\n  { id: 'au', name: 'Australia', need: 'premium', flag: '🇦🇺' },\n  { id: 'br', name: 'Brazil', need: 'ultimate', flag: '🇧🇷' },\n  { id: 'in', name: 'India', need: 'ultimate', flag: '🇮🇳' },\n  { id: 'za', name: 'South Africa', need: 'ultimate', flag: '🇿🇦' },\n  { id: 'is', name: 'Iceland', need: 'ultimate', flag: '🇮🇸' }\n];\nfunction serverName(id) {\n  return (SERVERS.find((s) => s.id === id) || SERVERS[0]).name;\n}\n\n/* ---------- events ---------- */\nfunction wire() {\n  $('#homeBtn').addEventListener('click', goHome);\n  $('#newTabBtn').addEventListener('click', () => newTab());\n  $('#tabCountBtn').addEventListener('click', () => openSheet('tabs'));\n  $('#menuBtn').addEventListener('click', () => openSheet('root'));\n  $('#planPill').addEventListener('click', () => openSheet('plans'));\n\n  $('#searchForm').addEventListener('submit', (e) => {\n    e.preventDefault();\n    const v = $('#searchInput').value;\n    if (!v.trim()) return;\n    navigate(v);\n    $('#searchInput').value = '';\n  });\n  $('#searchInput').addEventListener('input', renderSuggest);\n  $('#searchInput').addEventListener('focus', renderSuggest);\n  $('#micBtn').addEventListener('click', voiceSearch);\n\n  $('#addShortcutBtn').addEventListener('click', addShortcutDialog);\n  $('#safetyBtn').addEventListener('click', () => openSheet('privacy'));\n\n  $('#addressForm').addEventListener('submit', (e) => {\n    e.preventDefault();\n    navigate($('#addressInput').value, { replace: true });\n  });\n  $('#backBtn').addEventListener('click', back);\n  $('#reloadBtn').addEventListener('click', () => loadFrame(activeTab().url));\n\n  $('#ffOpen').addEventListener('click', () => {\n    const u = activeTab().url;\n    if (u) window.open(u, '_blank', 'noopener');\n  });\n  $('#ffCopy').addEventListener('click', async () => {\n    try { await navigator.clipboard.writeText(activeTab().url); toast('Link copied'); } catch { toast('Copy failed'); }\n  });\n\n  $('#sheetClose').addEventListener('click', closeSheet);\n  $('#sheetBack').addEventListener('click', sheetBack);\n  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });\n\n  $('#homeView').addEventListener('scroll', () => {\n    $('#topbar').classList.toggle('scrolled', $('#homeView').scrollTop > 6);\n  }, { passive: true });\n\n  document.addEventListener('click', (e) => {\n    const act = e.target.closest('[data-act]');\n    if (act) {\n      const fn = window.ACTIONS && ACTIONS[act.dataset.act];\n      if (fn) { e.preventDefault(); fn(act, e); }\n      return;\n    }\n    if (!e.target.closest('.searchpill') && !e.target.closest('#suggest')) $('#suggest').hidden = true;\n  });\n\n  document.addEventListener('change', (e) => {\n    const node = e.target.closest('[data-input]');\n    if (!node) return;\n    const fn = window.ACTIONS && ACTIONS.input;\n    if (fn) fn(node, e);\n  });\n\n  document.addEventListener('keydown', (e) => {\n    const meta = e.metaKey || e.ctrlKey;\n    if (meta && e.key.toLowerCase() === 't') { e.preventDefault(); newTab(); }\n    if (meta && e.key.toLowerCase() === 'l') { e.preventDefault(); $('#searchInput')?.focus(); }\n    if (meta && e.key.toLowerCase() === 'w') { e.preventDefault(); closeTab(activeId); }\n    if (e.key === 'Escape') {\n      if (!$('#modal').hidden) closeModal();\n      else if (!$('#sheet').hidden) closeSheet();\n    }\n  });\n}\n\nfunction renderSuggest() {\n  const q = $('#searchInput').value.trim();\n  const box = $('#suggest');\n  if (!S.home.suggestions || q.length \u003c 2) { box.hidden = true; return; }\n  const local = S.history.items\n    .filter((h) => (h.title + ' ' + h.url).toLowerCase().includes(q.toLowerCase()))\n    .slice(0, 3);\n  const rows = [\n    ...local.map((h) => ({ text: h.title, url: h.url, type: 'history' })),\n    { text: q, type: 'search' },\n    { text: q + ' news', type: 'search' }\n  ];\n  box.innerHTML = rows.map((r) => `\u003cbutton data-sug=\"${esc(r.text)}\">\n    \u003cspan>${esc(r.text)}\u003c/span>\u003cspan class=\"sug-type\">${r.type === 'history' ? 'history' : engine().name}\u003c/span>\n  \u003c/button>`).join('');\n  box.hidden = false;\n  $$('#suggest button').forEach((b) => b.addEventListener('click', () => {\n    const text = b.dataset.sug;\n    const hit = rows.find((r) => r.text === text && r.url);\n    navigate(hit ? hit.url : text);\n    $('#searchInput').value = '';\n    box.hidden = true;\n  }));\n}\n\nfunction voiceSearch() {\n  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n  const btn = $('#micBtn');\n  if (!SR) { toast('Voice search needs a browser with the Web Speech API'); return; }\n  const rec = new SR();\n  rec.lang = navigator.language || 'en-US';\n  rec.interimResults = false;\n  btn.classList.add('live');\n  rec.onresult = (ev) => {\n    const text = ev.results[0][0].transcript;\n    navigate(text);\n    $('#searchInput').value = '';\n  };\n  rec.onerror = () => toast('Could not hear that — try again');\n  rec.onend = () => btn.classList.remove('live');\n  try { rec.start(); } catch { btn.classList.remove('live'); }\n}\n\nfunction addShortcutDialog() {\n  openModal(`\u003ch3>Add a shortcut\u003c/h3>\n    \u003cp>Shortcuts sit on your start page. They never leave this device.\u003c/p>\n    \u003cdiv class=\"field\">\u003clabel>Name\u003c/label>\u003cinput id=\"scName\" type=\"text\" placeholder=\"Example\" maxlength=\"24\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel>Address\u003c/label>\u003cinput id=\"scUrl\" type=\"text\" placeholder=\"example.com\">\u003c/div>\n    \u003cdiv class=\"modal-actions\">\u003cbutton class=\"ghost-btn\" id=\"scCancel\">Cancel\u003c/button>\u003cbutton class=\"primary-btn\" id=\"scSave\">Add\u003c/button>\u003c/div>`,\n    (root) => {\n      $('#scCancel', root).addEventListener('click', closeModal);\n      $('#scSave', root).addEventListener('click', () => {\n        const name = $('#scName', root).value.trim();\n        const url = toURL($('#scUrl', root).value.trim());\n        if (!name || !url) { toast('Add a name and an address'); return; }\n        if (!S.home.shortcuts) { S.home.shortcuts = true; }\n        const max = can('premium') ? 12 : 8;\n        S.shortcuts = [...S.shortcuts, { name, url }].slice(-max);\n        save(); renderHome(); closeModal(); toast('Shortcut added');\n      });\n    });\n}\n","src/onboarding.js":"'use strict';\n/* ============================================================\n   Titanium — onboarding: five questions before you browse\n   ============================================================ */\n\nconst HEARD_FROM = [\n  { id: 'appstore', label: 'App Store or Play Store', glyph: '▣' },\n  { id: 'friend', label: 'A friend or family member', glyph: '☺' },\n  { id: 'youtube', label: 'YouTube', glyph: '▶' },\n  { id: 'social', label: 'TikTok, Instagram or X', glyph: '#' },\n  { id: 'search', label: 'A search result', glyph: '⌕' },\n  { id: 'github', label: 'GitHub or open source', glyph: '⑂' },\n  { id: 'podcast', label: 'A podcast or newsletter', glyph: '◉' },\n  { id: 'other', label: 'Somewhere else', glyph: '…' }\n];\n\nlet obStep = 0;\nlet obDraft = {\n  heardFrom: '',\n  device: 'mobile',\n  accountMode: 'create',\n  name: '',\n  email: '',\n  historyOn: true,\n  incognito: false,\n  delegationMode: 'device',\n  delegateLabel: '',\n  scope: { titles: true, urls: true, downloads: false },\n  expiry: 30,\n  importCode: ''\n};\n\nfunction startOnboarding() {\n  const saved = S.heardFrom;\n  if (saved) obDraft.heardFrom = saved;\n  obDraft.device = S.device || 'mobile';\n  $('#onboard').hidden = false;\n  $('#app').hidden = true;\n  $('#boot').classList.add('hide');\n  setTimeout(() => { $('#boot').hidden = true; }, 380);\n  renderOnboard();\n}\n\nfunction renderOnboard() {\n  const total = 5;\n  $('#progress').innerHTML = Array.from({ length: total }, (_, i) => `\u003ci class=\"${i \u003c= obStep ? 'on' : ''}\">\u003c/i>`).join('');\n  $('#onboardBody').innerHTML = ONBOARD_STEPS[obStep]();\n  $('#onboardBack').hidden = obStep === 0;\n  $('#onboardNext').textContent = obStep === total - 1 ? 'Start browsing' : 'Continue';\n  $('#onboardBody').scrollTop = 0;\n  bindOnboard();\n}\n\nfunction bindOnboard() {\n  $$('#onboardBody [data-heard]').forEach((b) => b.addEventListener('click', () => {\n    obDraft.heardFrom = b.dataset.heard;\n    $$('#onboardBody [data-heard]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n  }));\n  $$('#onboardBody [data-dev]').forEach((b) => b.addEventListener('click', () => {\n    obDraft.device = b.dataset.dev;\n    document.documentElement.dataset.device = obDraft.device;\n    $$('#onboardBody [data-dev]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n    const note = $('#devNote');\n    if (note) note.textContent = obDraft.device === 'mobile'\n      ? 'Mobile layout: full-bleed cards, bigger targets, search-first start page.'\n      : 'Desktop layout: wide canvas, two-column start page, keyboard shortcuts on.';\n  }));\n  $$('#onboardBody [data-acct]').forEach((b) => b.addEventListener('click', () => {\n    obDraft.accountMode = b.dataset.acct;\n    $$('#onboardBody [data-acct]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n    const fields = $('#acctFields');\n    if (fields) fields.hidden = obDraft.accountMode !== 'create';\n  }));\n  const histToggle = $('#obHist');\n  if (histToggle) histToggle.addEventListener('click', () => {\n    obDraft.historyOn = !obDraft.historyOn;\n    histToggle.setAttribute('aria-pressed', String(obDraft.historyOn));\n  });\n  const incToggle = $('#obIncognito');\n  if (incToggle) incToggle.addEventListener('click', () => {\n    obDraft.incognito = !obDraft.incognito;\n    incToggle.setAttribute('aria-pressed', String(obDraft.incognito));\n  });\n  $$('#onboardBody [data-deleg]').forEach((b) => b.addEventListener('click', () => {\n    obDraft.delegationMode = b.dataset.deleg;\n    $$('#onboardBody [data-deleg]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n    const box = $('#delegBox');\n    if (box) box.hidden = obDraft.delegationMode !== 'delegate';\n    const imp = $('#importBox');\n    if (imp) imp.hidden = obDraft.delegationMode !== 'import';\n  }));\n  $$('#onboardBody [data-scope]').forEach((b) => b.addEventListener('click', () => {\n    const k = b.dataset.scope;\n    obDraft.scope[k] = !obDraft.scope[k];\n    b.setAttribute('aria-pressed', String(obDraft.scope[k]));\n  }));\n  $$('#onboardBody [data-expiry]').forEach((b) => b.addEventListener('click', () => {\n    obDraft.expiry = Number(b.dataset.expiry);\n    $$('#onboardBody [data-expiry]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n  }));\n}\n\nconst ONBOARD_STEPS = [\n  () => `\n    \u003cdiv class=\"step-kicker\">Question 1 of 5\u003c/div>\n    \u003ch1 class=\"step-title\">Where did you hear\u003cbr>about Titanium?\u003c/h1>\n    \u003cp class=\"step-sub\">It helps us know what to build next. Nothing is sent to a server — this stays in your browser profile.\u003c/p>\n    \u003cdiv class=\"opt-grid\">\n      ${HEARD_FROM.map((h) => `\u003cbutton class=\"opt\" data-heard=\"${h.id}\" aria-pressed=\"${obDraft.heardFrom === h.id}\">\n        \u003cspan class=\"opt-glyph\">${h.glyph}\u003c/span>\u003cspan>${h.label}\u003c/span>\n      \u003c/button>`).join('')}\n    \u003c/div>`,\n\n  () => `\n    \u003cdiv class=\"step-kicker\">Question 2 of 5\u003c/div>\n    \u003ch1 class=\"step-title\">What are you\u003cbr>browsing on?\u003c/h1>\n    \u003cp class=\"step-sub\">Titanium reshapes itself for the screen you pick. Tap the other one any time in Settings → Appearance.\u003c/p>\n    \u003cdiv class=\"device-pick\">\n      \u003cbutton class=\"device-card\" data-dev=\"mobile\" aria-pressed=\"${obDraft.device === 'mobile'}\">\n        \u003cspan class=\"device-art\">\u003cspan class=\"screen\">\u003c/span>\u003c/span>\n        Mobile\n      \u003c/button>\n      \u003cbutton class=\"device-card\" data-dev=\"pc\" aria-pressed=\"${obDraft.device === 'pc'}\">\n        \u003cspan class=\"device-art pc\">\u003cspan class=\"screen\">\u003c/span>\u003c/span>\n        PC or laptop\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"banner\">\n      \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 3v18M5 8l7-5 7 5v8l-7 5-7-5Z\"/>\u003c/svg>\n      \u003cdiv>\u003cb>Mobile first\u003c/b>\u003cspan id=\"devNote\">${obDraft.device === 'mobile' ? 'Mobile layout: full-bleed cards, bigger targets, search-first start page.' : 'Desktop layout: wide canvas, two-column start page, keyboard shortcuts on.'}\u003c/span>\u003c/div>\n    \u003c/div>`,\n\n  () => `\n    \u003cdiv class=\"step-kicker\">Question 3 of 5\u003c/div>\n    \u003ch1 class=\"step-title\">Who's doing\u003cbr>the browsing?\u003c/h1>\n    \u003cp class=\"step-sub\">Titanium accounts are local. No password, no server, no email verification — just a profile that keeps your shortcuts, plan and history together on this device.\u003c/p>\n    \u003cdiv class=\"opt-grid\">\n      \u003cbutton class=\"opt\" data-acct=\"create\" aria-pressed=\"${obDraft.accountMode === 'create'}\">\n        \u003cspan class=\"opt-glyph\">＋\u003c/span>\u003cspan>Create a local profile\u003csmall>Name, email and an avatar colour\u003c/small>\u003c/span>\n      \u003c/button>\n      \u003cbutton class=\"opt\" data-acct=\"guest\" aria-pressed=\"${obDraft.accountMode === 'guest'}\">\n        \u003cspan class=\"opt-glyph\">◐\u003c/span>\u003cspan>Continue as guest\u003csmall>Everything works, nothing is labelled\u003c/small>\u003c/span>\n      \u003c/button>\n      \u003cbutton class=\"opt\" data-acct=\"later\" aria-pressed=\"${obDraft.accountMode === 'later'}\">\n        \u003cspan class=\"opt-glyph\">→\u003c/span>\u003cspan>Set it up later\u003csmall>Add a profile from Settings\u003c/small>\u003c/span>\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"field\" id=\"acctFields\" ${obDraft.accountMode !== 'create' ? 'hidden' : ''}>\n      \u003clabel>Display name\u003c/label>\n      \u003cinput id=\"obName\" type=\"text\" placeholder=\"Alex Rivera\" maxlength=\"40\" value=\"${esc(obDraft.name)}\">\n      \u003clabel style=\"margin-top:8px\">Email (stays on this device)\u003c/label>\n      \u003cinput id=\"obEmail\" type=\"email\" placeholder=\"you@example.com\" value=\"${esc(obDraft.email)}\">\n      \u003cspan class=\"hint\">Used only for your profile card and plan receipts.\u003c/span>\n    \u003c/div>`,\n\n  () => `\n    \u003cdiv class=\"step-kicker\">Question 4 of 5\u003c/div>\n    \u003ch1 class=\"step-title\">Should Titanium\u003cbr>remember where\u003cbr>you've been?\u003c/h1>\n    \u003cp class=\"step-sub\">History powers suggestions, “jump back in” and delegation to another device. You can clear it in one tap — or never keep it at all.\u003c/p>\n    \u003cdiv class=\"list\">\n      \u003cdiv class=\"list-row\">\n        \u003cspan class=\"lr-icon\">◷\u003c/span>\n        \u003cspan class=\"lr-body\">\u003cb>Save browsing history\u003c/b>\u003csmall>${obDraft.historyOn ? 'Titles and addresses, kept locally' : 'History is off — nothing recorded'}\u003c/small>\u003c/span>\n        \u003cbutton class=\"toggle\" id=\"obHist\" aria-pressed=\"${obDraft.historyOn}\" aria-label=\"Save history\">\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"list-row\">\n        \u003cspan class=\"lr-icon\">◑\u003c/span>\n        \u003cspan class=\"lr-body\">\u003cb>Start new tabs in private mode\u003c/b>\u003csmall>Private tabs are never saved or delegated\u003c/small>\u003c/span>\n        \u003cbutton class=\"toggle\" id=\"obIncognito\" aria-pressed=\"${obDraft.incognito}\" aria-label=\"Private by default\">\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"banner\">\n      \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>\u003c/svg>\n      \u003cdiv>\u003cb>Retention follows your plan\u003c/b>\u003cspan>Free keeps 7 days, Premium 90 days, Ultimate a full year. You can shorten it at any time.\u003c/span>\u003c/div>\n    \u003c/div>`,\n\n  () => `\n    \u003cdiv class=\"step-kicker\">Question 5 of 5\u003c/div>\n    \u003ch1 class=\"step-title\">Who gets to see\u003cbr>your history?\u003c/h1>\n    \u003cp class=\"step-sub\">History delegation lets you hand a scoped, expiring copy of your history to a person or another device — without an account server in the middle.\u003c/p>\n    \u003cdiv class=\"opt-grid\">\n      \u003cbutton class=\"opt\" data-deleg=\"device\" aria-pressed=\"${obDraft.delegationMode === 'device'}\">\n        \u003cspan class=\"opt-glyph\">▢\u003c/span>\u003cspan>Keep it on this device\u003csmall>Nothing leaves the browser\u003c/small>\u003c/span>\n      \u003c/button>\n      \u003cbutton class=\"opt\" data-deleg=\"delegate\" aria-pressed=\"${obDraft.delegationMode === 'delegate'}\">\n        \u003cspan class=\"opt-glyph\">⇄\u003c/span>\u003cspan>Delegate to a trusted person\u003csmall>Premium and Ultimate · scoped and expiring\u003c/small>\u003c/span>\n      \u003c/button>\n      \u003cbutton class=\"opt\" data-deleg=\"import\" aria-pressed=\"${obDraft.delegationMode === 'import'}\">\n        \u003cspan class=\"opt-glyph\">⇩\u003c/span>\u003cspan>Import history from another device\u003csmall>Paste a delegation code\u003c/small>\u003c/span>\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"delegBox\" ${obDraft.delegationMode !== 'delegate' ? 'hidden' : ''}>\n      \u003cdiv class=\"field\">\n        \u003clabel>Delegate's name\u003c/label>\n        \u003cinput id=\"obDelegName\" type=\"text\" placeholder=\"e.g. Sam — family iPad\" value=\"${esc(obDraft.delegateLabel)}\">\n      \u003c/div>\n      \u003cdiv class=\"list\">\n        \u003cdiv class=\"list-row\">\u003cspan class=\"lr-body\">\u003cb>What they can see\u003c/b>\u003csmall>Pick the minimum you need\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" data-scope=\"titles\" aria-pressed=\"${obDraft.scope.titles}\">Titles\u003c/button>\n          \u003cbutton class=\"chip\" data-scope=\"urls\" aria-pressed=\"${obDraft.scope.urls}\">Full URLs\u003c/button>\n          \u003cbutton class=\"chip\" data-scope=\"downloads\" aria-pressed=\"${obDraft.scope.downloads}\">Downloads\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"list-row\" style=\"border-top:1px solid var(--line)\">\u003cspan class=\"lr-body\">\u003cb>Access expires after\u003c/b>\u003csmall>Then the code stops importing\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"chips\">\n          ${[1, 7, 30, 90].map((d) => `\u003cbutton class=\"chip\" data-expiry=\"${d}\" aria-pressed=\"${obDraft.expiry === d}\">${d} day${d > 1 ? 's' : ''}\u003c/button>`).join('')}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\" id=\"importBox\" ${obDraft.delegationMode !== 'import' ? 'hidden' : ''}>\n      \u003clabel>Delegation code\u003c/label>\n      \u003ctextarea id=\"obImport\" placeholder=\"TiD1.…\">\u003c/textarea>\n      \u003cspan class=\"hint\">Codes are base64 JSON bundles, not encrypted. Share them the way you'd share a file.\u003c/span>\n    \u003c/div>`\n];\n\nfunction obNext() {\n  if (obStep === 2) {\n    const name = $('#obName')?.value.trim();\n    const email = $('#obEmail')?.value.trim();\n    if (obDraft.accountMode === 'create') {\n      if (!name) { toast('Add a display name first'); return; }\n      obDraft.name = name;\n      obDraft.email = email || '';\n    }\n  }\n  if (obStep === 4) {\n    if (obDraft.delegationMode === 'delegate') {\n      obDraft.delegateLabel = $('#obDelegName')?.value.trim() || 'Trusted device';\n    }\n    if (obDraft.delegationMode === 'import') {\n      obDraft.importCode = $('#obImport')?.value.trim() || '';\n    }\n  }\n  if (obStep \u003c ONBOARD_STEPS.length - 1) {\n    obStep += 1;\n    renderOnboard();\n  } else {\n    finishOnboarding();\n  }\n}\n\nfunction obBack() {\n  if (obStep > 0) {\n    obStep -= 1;\n    renderOnboard();\n  }\n}\n\nfunction finishOnboarding() {\n  S.heardFrom = obDraft.heardFrom || 'not specified';\n  S.device = obDraft.device;\n  S.history.on = obDraft.historyOn;\n  S.history.incognito = obDraft.incognito;\n\n  if (obDraft.accountMode === 'create') {\n    S.account = {\n      name: obDraft.name || 'Titanium user',\n      email: obDraft.email || '',\n      guest: false,\n      createdAt: Date.now()\n    };\n  } else if (obDraft.accountMode === 'guest') {\n    S.account = { name: 'Guest', email: '', guest: true, createdAt: Date.now() };\n  }\n\n  if (obDraft.delegationMode === 'delegate') {\n    S.delegation.active = {\n      label: obDraft.delegateLabel || 'Trusted device',\n      scope: { ...obDraft.scope },\n      expiresAt: Date.now() + obDraft.expiry * 86400000,\n      createdAt: Date.now(),\n      code: null\n    };\n    S.delegation.log.unshift({ ts: Date.now(), text: `Delegation granted to ${S.delegation.active.label}` });\n  }\n  if (obDraft.delegationMode === 'import' && obDraft.importCode) {\n    const result = importDelegation(obDraft.importCode);\n    if (!result.ok) toast(result.error);\n  }\n\n  S.onboarded = true;\n  save();\n  $('#onboard').hidden = true;\n  startApp();\n  toast(`Welcome${S.account && !S.account.guest ? ', ' + S.account.name.split(' ')[0] : ''} — you're on ${PLANS[S.plan].name}`);\n}\n","src/panels.js":"'use strict';\n/* ============================================================\n   Titanium — panels part 1: building blocks, home, tabs,\n   appearance, search engines, privacy\n   ============================================================ */\n\nconst ICON = {\n  palette: '\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/>\u003ccircle cx=\"9\" cy=\"9.5\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"15\" cy=\"9.5\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"9.5\" cy=\"15\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>\u003cpath d=\"M14 15.2c1.5.4 2.6-.3 2.9-1.6\"/>',\n  search: '\u003ccircle cx=\"11\" cy=\"11\" r=\"6.5\"/>\u003cpath d=\"M16 16l4.5 4.5\"/>',\n  shield: '\u003cpath d=\"M12 3.2 19 6v6.1c0 4.3-3 7.6-7 8.9-4-1.3-7-4.6-7-8.9V6l7-2.8Z\"/>\u003cpath d=\"M9.2 12l2 2 3.6-4\"/>',\n  globe: '\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/>\u003cpath d=\"M3.5 12h17M12 3.5c2.4 2.5 2.4 14.5 0 17M12 3.5c-2.4 2.5-2.4 14.5 0 17\"/>',\n  clock: '\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/>\u003cpath d=\"M12 7v5l3.2 2\"/>',\n  puzzle: '\u003cpath d=\"M9 4.5h6v3a2 2 0 1 0 3.5 1.6V15h-3a2 2 0 1 0-1.6 3.5H5V9.5h3a2 2 0 1 0 1-5Z\"/>',\n  star: '\u003cpath d=\"M12 3.6l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8Z\"/>',\n  info: '\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/>\u003cpath d=\"M12 11v6M12 7.6v.1\"/>',\n  tabs: '\u003crect x=\"3.5\" y=\"7\" width=\"13\" height=\"12\" rx=\"2.5\"/>\u003cpath d=\"M8 7V5.5A1.5 1.5 0 0 1 9.5 4H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 16h-1\"/>',\n  user: '\u003ccircle cx=\"12\" cy=\"8.5\" r=\"3.6\"/>\u003cpath d=\"M5 20c1-3.4 3.6-5.2 7-5.2s6 1.8 7 5.2\"/>',\n  trash: '\u003cpath d=\"M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7\"/>',\n  copy: '\u003crect x=\"8.5\" y=\"8.5\" width=\"11\" height=\"11\" rx=\"2.5\"/>\u003cpath d=\"M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5\"/>',\n  arrow: '\u003cpath d=\"M5 12h13M13 6l6 6-6 6\"/>',\n  download: '\u003cpath d=\"M12 4v11M8 11.5l4 4 4-4M5 19h14\"/>',\n  lock: '\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"3\"/>\u003cpath d=\"M8.5 10V8a3.5 3.5 0 0 1 7 0v2\"/>',\n  power: '\u003cpath d=\"M12 4v8M7.5 6.8a7 7 0 1 0 9 0\"/>',\n  sparkle: '\u003cpath d=\"M12 3.5l1.8 4.7 4.7 1.8-4.7 1.8L12 16.5l-1.8-4.7L5.5 10l4.7-1.8Z\"/>\u003cpath d=\"M18.5 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8Z\"/>',\n  refresh: '\u003cpath d=\"M19 12a7 7 0 1 1-2.4-5.3M19 4v5h-5\"/>',\n  mobile: '\u003crect x=\"7\" y=\"3\" width=\"10\" height=\"18\" rx=\"2.5\"/>\u003cpath d=\"M11 18h2\"/>',\n  monitor: '\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M9 20h6M12 17v3\"/>',\n  ext: '\u003cpath d=\"M9 4.5h6v3a2 2 0 1 0 3.5 1.6V15h-3a2 2 0 1 0-1.6 3.5H5V9.5h3a2 2 0 1 0 1-5Z\"/>',\n  code: '\u003cpath d=\"M8.5 7.5 4 12l4.5 4.5M15.5 7.5 20 12l-4.5 4.5M13 5l-2 14\"/>'\n};\n\nconst LOOK_PRESETS = {\n  minimal: { mode: 'midnight', accentId: 'blue', accent: '#8ab4f8', radius: 14, density: 'cozy', font: 15, wallpaper: false, iconStyle: 'color', searchShape: 'pill', animations: true },\n  reference: { mode: 'midnight', accentId: 'blue', accent: '#8ab4f8', radius: 22, density: 'comfortable', font: 15, wallpaper: true, iconStyle: 'color', searchShape: 'pill', animations: true },\n  mono: { iconStyle: 'mono', wallpaper: false, radius: 16, searchShape: 'rounded', density: 'comfortable', animations: true },\n  compact: { radius: 12, density: 'cozy', font: 14, wallpaper: false, iconStyle: 'color', searchShape: 'pill', animations: true },\n  bold: { accentId: 'violet', accent: '#b9a6ff', radius: 26, density: 'spacious', font: 16, wallpaper: true, iconStyle: 'color', searchShape: 'rounded', animations: true }\n};\n\nfunction ico(name, cls = '') {\n  return `\u003csvg class=\"${cls}\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">${ICON[name] || ''}\u003c/svg>`;\n}\n\nfunction toggleRow({ title, sub, path, checked, need, disabled }) {\n  const locked = need && !can(need);\n  return `\u003cdiv class=\"list-row\">\n    \u003cspan class=\"lr-body\">\u003cb>${esc(title)}${locked ? ' \u003cspan class=\"perm\">' + (need === 'premium' ? 'Premium' : 'Ultimate') + '\u003c/span>' : ''}\u003c/b>\u003csmall>${esc(sub)}\u003c/small>\u003c/span>\n    \u003cbutton class=\"toggle\" data-act=\"toggle\" data-path=\"${path}\" ${need ? `data-need=\"${need}\"` : ''} aria-pressed=\"${!!checked}\" aria-label=\"${esc(title)}\" ${disabled ? 'disabled' : ''}>\u003c/button>\n  \u003c/div>`;\n}\n\nfunction rowButton({ icon, title, sub, panel, act, right }) {\n  return `\u003cbutton class=\"list-row\" ${panel ? `data-act=\"sheet\" data-panel=\"${panel}\"` : `data-act=\"${act}\"`}>\n    \u003cspan class=\"lr-icon\">${ico(icon)}\u003c/span>\n    \u003cspan class=\"lr-body\">\u003cb>${esc(title)}\u003c/b>${sub ? `\u003csmall>${esc(sub)}\u003c/small>` : ''}\u003c/span>\n    ${right || '\u003cspan class=\"chev\">›\u003c/span>'}\n  \u003c/button>`;\n}\n\nfunction planLock(need, label = '') {\n  if (!need || can(need)) return '';\n  return `\u003cspan class=\"perm\">${need === 'premium' ? 'Premium' : 'Ultimate'}${label ? ' · ' + label : ''}\u003c/span>`;\n}\n\nconst PANELS = {};\n\n/* ---------------- home / menu root ---------------- */\nPANELS.root = () => ({\n  title: 'Menu',\n  html: `\n    \u003cbutton class=\"list-row\" data-act=\"sheet\" data-panel=\"account\">\n      \u003cspan class=\"lr-icon\" style=\"background:${S.account ? `hsl(${hueFor(S.account.name)} 45% 40%)` : 'var(--card-3)'};color:#fff;font-weight:800\">${esc((S.account?.name || 'T')[0].toUpperCase())}\u003c/span>\n      \u003cspan class=\"lr-body\">\n        \u003cb>${esc(S.account ? S.account.name : 'No profile yet')}${S.account?.guest ? ' (guest)' : ''}\u003c/b>\n        \u003csmall>${esc(S.account?.email || 'Local profile')} · ${PLANS[S.plan].name} plan\u003c/small>\n      \u003c/span>\n      \u003cspan class=\"chev\">›\u003c/span>\n    \u003c/button>\n    \u003cbutton class=\"list-row\" data-act=\"sheet\" data-panel=\"plans\" style=\"border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,var(--card))\">\n      \u003cspan class=\"lr-icon\">${ico('star')}\u003c/span>\n      \u003cspan class=\"lr-body\">\u003cb>${S.plan === 'free' ? 'Upgrade Titanium' : PLANS[S.plan].name + ' is active'}\u003c/b>\u003csmall>${S.plan === 'free' ? 'From $4.99 · strict blocking, VPN, delegation' : 'Manage your plan and receipts'}\u003c/small>\u003c/span>\n      \u003cspan class=\"chev\">›\u003c/span>\n    \u003c/button>\n\n    \u003cdiv class=\"section-label\">Browser\u003c/div>\n    \u003cdiv class=\"list\">\n      ${rowButton({ icon: 'tabs', title: 'Tabs', sub: `${tabs.length} open`, panel: 'tabs' })}\n      ${rowButton({ icon: 'search', title: 'Search engine', sub: engine().name, panel: 'engines' })}\n      ${rowButton({ icon: 'clock', title: 'History', sub: S.history.on ? `${S.history.items.length} entries · ${S.history.retention} days` : 'Off', panel: 'history' })}\n      ${rowButton({ icon: 'download', title: 'Delegation', sub: S.delegation.active ? `Granted to ${S.delegation.active.label}` : 'Not delegated', panel: 'delegation' })}\n    \u003c/div>\n\n    \u003cdiv class=\"section-label\">Protection\u003c/div>\n    \u003cdiv class=\"list\">\n      ${rowButton({ icon: 'shield', title: 'Privacy & ad blocking', sub: S.privacy.adblock === 'off' ? 'Blocking off' : `${S.privacy.adblock} blocking · Safe Browsing ${S.privacy.safeBrowsing ? 'on' : 'off'}`, panel: 'privacy' })}\n      ${rowButton({ icon: 'globe', title: 'VPN', sub: S.vpn.on ? `${serverName(S.vpn.server)} · connected` : 'Off', panel: 'vpn' })}\n      ${rowButton({ icon: 'puzzle', title: 'Extensions', sub: 'Chrome extensions, loaded locally', panel: 'extensions' })}\n    \u003c/div>\n\n    \u003cdiv class=\"section-label\">Make it yours\u003c/div>\n    \u003cdiv class=\"list\">\n      ${rowButton({ icon: 'palette', title: 'Appearance', sub: `${THEMES.find((x) => x.id === S.theme.mode)?.name || 'Midnight'} · ${deviceName()} layout`, panel: 'appearance' })}\n      ${rowButton({ icon: 'sparkle', title: 'Start page shortcuts', sub: `${S.shortcuts.length} shortcuts`, panel: 'shortcuts' })}\n      ${rowButton({ icon: 'code', title: 'Source code', sub: 'View, edit and download every file', act: 'openSource' })}\n      ${rowButton({ icon: 'info', title: 'About Titanium', sub: `v${VERSION} · MIT licensed`, panel: 'about' })}\n    \u003c/div>\n    \u003cdiv class=\"list\">\n      \u003cbutton class=\"list-row\" data-act=\"reset\">\u003cspan class=\"lr-icon\" style=\"color:var(--danger)\">${ico('refresh')}\u003c/span>\u003cspan class=\"lr-body\">\u003cb>Reset Titanium\u003c/b>\u003csmall>Wipe local profile, history and settings\u003c/small>\u003c/span>\u003c/button>\n    \u003c/div>\n    \u003cp class=\"hint\" style=\"text-align:center;color:var(--muted-2);font-size:11.5px;margin:4px 0 0\">Titanium ${VERSION} · everything is stored on this device\u003c/p>`\n});\n\n/* ---------------- tabs ---------------- */\nPANELS.tabs = () => ({\n  title: 'Tabs',\n  html: `\n    \u003cdiv class=\"list\" id=\"tabList\">\n      ${tabs.map((t) => `\u003cbutton class=\"list-row\" data-act=\"switchTab\" data-id=\"${t.id}\">\n        \u003cspan class=\"lr-icon\">${t.url ? esc(badgeFor(t.url).letter) : ico('home')}\u003c/span>\n        \u003cspan class=\"lr-body\">\u003cb>${esc(t.url ? hostOf(t.url) : 'New tab')}\u003c/b>\u003csmall>${esc(t.url || 'Start page')}\u003c/small>\u003c/span>\n        \u003cspan class=\"mini-btn danger\" data-act=\"closeTab\" data-id=\"${t.id}\" role=\"button\">Close\u003c/span>\n      \u003c/button>`).join('')}\n    \u003c/div>\n    \u003cdiv class=\"plan-actions\">\n      \u003cbutton class=\"mini-btn accent\" data-act=\"newtab\">New tab\u003c/button>\n      \u003cbutton class=\"mini-btn\" data-act=\"closeOthers\">Close others\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"banner\">${ico('info')}\u003cdiv>\u003cb>Tab limit\u003c/b>\u003cspan>${S.plan === 'free' ? 'Free allows 5 tabs at once — Premium raises it to 20, Ultimate is unlimited.' : 'Your plan has room for ' + (S.plan === 'premium' ? '20 tabs' : 'unlimited tabs') + '.'}\u003c/span>\u003c/div>\u003c/div>`\n});\n\n/* ---------------- appearance ---------------- */\nPANELS.appearance = () => ({\n  title: 'Appearance',\n  html: `\n    \u003cdiv class=\"section-label\">Presets\u003c/div>\n    \u003cdiv class=\"chips\">\n      ${[['minimal', 'Minimal'], ['reference', 'Reference'], ['mono', 'Monochrome'], ['compact', 'Compact'], ['bold', 'Bold']].map(([id, label]) => `\u003cbutton class=\"chip\" data-act=\"preset\" data-preset=\"${id}\" aria-pressed=\"${S.theme.preset === id}\">${label}\u003c/button>`).join('')}\n    \u003c/div>\n\n    \u003cdiv class=\"section-label\">Theme\u003c/div>\n    \u003cdiv class=\"chips\">\n      ${THEMES.map((t) => `\u003cbutton class=\"chip\" data-act=\"theme\" data-theme=\"${t.id}\" aria-pressed=\"${S.theme.mode === t.id}\">${t.name}\u003c/button>`).join('')}\n    \u003c/div>\n\n    \u003cdiv class=\"section-label\">Accent\u003c/div>\n    \u003cdiv class=\"swatches\">\n      ${ACCENTS.map((a) => `\u003cbutton class=\"swatch\" title=\"${a.name}\" data-act=\"accent\" data-accent=\"${a.id}\" aria-pressed=\"${S.theme.accentId === a.id}\" style=\"background:${a.color}\">\u003c/button>`).join('')}\n      \u003clabel class=\"swatch\" title=\"Custom accent\" style=\"background:conic-gradient(#ff6b6b,#ffd166,#7ee0c0,#8ab4f8,#b9a6ff,#ff6b6b);display:grid;place-items:center;cursor:pointer\">\n        \u003cinput type=\"color\" data-input=\"theme.accent\" value=\"${S.theme.accent}\" style=\"opacity:0;width:100%;height:100%;border:0;cursor:pointer\">\n      \u003c/label>\n    \u003c/div>\n\n    \u003cdiv class=\"section-label\">Layout\u003c/div>\n    \u003cdiv class=\"list\">\n      \u003cdiv class=\"list-row\">\n        \u003cspan class=\"lr-icon\">${ico(S.device === 'mobile' ? 'mobile' : 'monitor')}\u003c/span>\n        \u003cspan class=\"lr-body\">\u003cb>Device layout\u003c/b>\u003csmall>Optimised for ${deviceName().toLowerCase()}\u003c/small>\u003c/span>\n        \u003cdiv class=\"chips\" style=\"padding:0\">\n          \u003cbutton class=\"chip\" data-act=\"device\" data-device=\"mobile\" aria-pressed=\"${S.device === 'mobile'}\">Mobile\u003c/button>\n          \u003cbutton class=\"chip\" data-act=\"device\" data-device=\"pc\" aria-pressed=\"${S.device === 'pc'}\">PC\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"range-row\">\u003cspan class=\"lr-body\">\u003cb style=\"font-size:13.5px\">Corner radius\u003c/b>\u003c/span>\n        \u003cinput type=\"range\" min=\"8\" max=\"30\" step=\"1\" value=\"${S.theme.radius}\" data-input=\"theme.radius\">\n        \u003coutput>${S.theme.radius}px\u003c/output>\n      \u003c/div>\n      \u003cdiv class=\"range-row\">\u003cspan class=\"lr-body\">\u003cb style=\"font-size:13.5px\">Text size\u003c/b>\u003c/span>\n        \u003cinput type=\"range\" min=\"13\" max=\"18\" step=\"1\" value=\"${S.theme.font}\" data-input=\"theme.font\">\n        \u003coutput>${S.theme.font}px\u003c/output>\n      \u003c/div>\n      \u003cdiv class=\"list-row\">\n        \u003cspan class=\"lr-body\">\u003cb>Density\u003c/b>\u003csmall>How much space cards get\u003c/small>\u003c/span>\n        \u003cdiv class=\"chips\" style=\"padding:0\">\n          ${['cozy', 'comfortable', 'spacious'].map((d) => `\u003cbutton class=\"chip\" data-act=\"density\" data-density=\"${d}\" aria-pressed=\"${S.theme.density === d}\">${d[0].toUpperCase() + d.slice(1)}\u003c/button>`).join('')}\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"list-row\">\n        \u003cspan class=\"lr-body\">\u003cb>Search bar\u003c/b>\u003csmall>Corner treatment for the pill\u003c/small>\u003c/span>\n        \u003cdiv class=\"chips\" style=\"padding:0\">\n          ${[['pill', 'Pill'], ['rounded', 'Rounded'], ['square', 'Square']].map(([id, label]) => `\u003cbutton class=\"chip\" data-act=\"shape\" data-shape=\"${id}\" aria-pressed=\"${S.theme.searchShape === id}\">${label}\u003c/button>`).join('')}\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"list-row\">\n        \u003cspan class=\"lr-body\">\u003cb>Icons\u003c/b>\u003csmall>Real colour marks or monochrome\u00
