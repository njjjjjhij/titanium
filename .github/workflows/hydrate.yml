name: Hydrate built site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hydrate]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch build payload
        run: curl -fsSL -o site.tar.gz https://titanium-build-payload-48ljzg-preview.freebuff.site/titanium-site.tar.gz
      - name: Extract
        run: |
          tar xzf site.tar.gz
          rm site.tar.gz
      - name: Commit built files
        run: |
          git config user.name "Titanium build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add built site: single-file browser, sources and screenshots" || echo "nothing new"
          git push
